<html lang="it">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: strumento da cantiere — barra superiore fissa, colonna unica, barra azioni in basso a portata di pollice */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --ink: #16202a;
  --muted: #5a6673;
  --line: #d6dce2;
  --accent: #1f4f8f;
  --accent-ink: #ffffff;
  --accent-soft: #e2ebf6;
  --signal: #f2b705;
  --signal-ink: #1f1a08;
  --ok: #2e7a4d;
  --warn: #9a5a06;
  --danger: #b3261e;
  --danger-soft: #fbe9e7;
  --overlay: rgba(12, 18, 24, .55);
  --f-display: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 10px;
  --bar-h: 76px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #18212a; --surface-2: #1e2933; --ink: #e5eaef; --muted: #9aa6b2;
    --line: #2c3844; --accent: #7aa9e8; --accent-ink: #0b1520; --accent-soft: #1d3150;
    --signal: #f2b705; --signal-ink: #1f1a08; --ok: #5cbf86; --warn: #e3a447; --danger: #f08a80;
    --danger-soft: #3a1f1d; --overlay: rgba(0, 0, 0, .65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #18212a; --surface-2: #1e2933; --ink: #e5eaef; --muted: #9aa6b2;
  --line: #2c3844; --accent: #7aa9e8; --accent-ink: #0b1520; --accent-soft: #1d3150;
  --signal: #f2b705; --signal-ink: #1f1a08; --ok: #5cbf86; --warn: #e3a447; --danger: #f08a80;
  --danger-soft: #3a1f1d; --overlay: rgba(0, 0, 0, .65); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Barra superiore */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; gap: 8px; min-height: 56px; padding-block: 6px; }
.bar-titles { flex: 1; min-width: 0; }
.bar-title { font-family: var(--f-display); font-weight: 600; font-size: 20px; line-height: 1.15; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 40px; height: 40px; flex: none; display: inline-grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.sync { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; flex: none; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.sync[data-s="busy"] .dot { background: var(--accent); animation: pulse 1s infinite alternate; }
.sync[data-s="offline"] .dot, .sync[data-s="auth"] .dot { background: var(--warn); }
.sync[data-s="error"] .dot { background: var(--danger); }
.sync[data-s="busy"], .sync[data-s="offline"], .sync[data-s="auth"], .sync[data-s="error"] { color: var(--ink); }
@keyframes pulse { to { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .sync[data-s="busy"] .dot { animation: none; } }

/* Contenuto */
.main { padding-block: 16px calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; max-width: 760px; margin: 0 auto; }
.main.no-bar { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.section-label { font-family: var(--f-display); font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 4px 0 -8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.list { display: grid; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 14px 14px; cursor: pointer; min-height: 64px; }
.list > .row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.row-sub { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.row-meta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.row svg.chev { width: 18px; height: 18px; color: var(--muted); flex: none; }
.row-thumb { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: 2px; margin-left: 6px; }
.tag.wait { background: var(--surface-2); color: var(--warn); border: 1px solid var(--line); }
.tag.err { background: var(--danger-soft); color: var(--danger); }
.empty { padding: 28px 20px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty strong { color: var(--ink); font-size: 16px; }
.notice { border: 1px solid var(--line); border-left: 4px solid var(--signal); background: var(--surface); padding: 10px 12px; border-radius: 8px; font-size: 13.5px; color: var(--muted); }
.notice strong { color: var(--ink); }
.notice.err { border-left-color: var(--danger); }
.info-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 14px; font-size: 14px; }
.info-grid dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.info-grid dd { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Segmenti */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 9px 8px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.seg button svg { width: 18px; height: 18px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Pulsanti */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.big { min-height: 54px; font-size: 16.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 auto; }

.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.actionbar-in { display: flex; gap: 10px; max-width: 760px; margin: 0 auto; }
.actionbar-in .btn { flex: 1; }
.actionbar-in .btn.grow { flex: 2.2; }

/* Campi */
.field { display: grid; gap: 5px; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 11px 12px; font-size: 16px; }
.field textarea { min-height: 96px; resize: vertical; }
.field small { color: var(--muted); font-size: 12px; }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.form { display: grid; gap: 14px; }

/* Griglia foto */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { position: relative; aspect-ratio: 1; max-width: 100%; border: 0; padding: 0; border-radius: 7px; overflow: hidden; background: var(--surface-2); cursor: pointer; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .num { position: absolute; left: 5px; top: 5px; background: var(--signal); color: var(--signal-ink); font-family: var(--f-mono); font-weight: 600; font-size: 12px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; display: grid; place-items: center; }
.tile .state { position: absolute; right: 5px; top: 5px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); color: var(--warn); display: grid; place-items: center; }
.tile .state svg { width: 14px; height: 14px; }
.tile .state.err { color: var(--danger); }
.tile .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 6px 5px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.75)); text-align: left; }
.tile .cap span { font-size: 11.5px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sync.compact { padding: 0; width: 40px; height: 40px; justify-content: center; border: 0; background: transparent; }
.sync.compact .txt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.sync.compact .dot { width: 10px; height: 10px; }

/* Planimetria */
.plan { position: relative; min-width: 0; max-width: 100%; box-sizing: border-box; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.plan-scroll { overflow: auto; min-width: 0; width: 100%; height: var(--plan-h, 50vh); box-sizing: border-box; touch-action: none; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: minmax(0, 1fr); }
.plan-stage { position: relative; margin: auto; line-height: 0; }
.plan-stage img { width: 100%; display: block; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; background: #fff; }
.plan-pins { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.plan-pins .hit { pointer-events: auto; cursor: pointer; }
.plan-tools { position: absolute; right: 8px; bottom: 8px; display: grid; gap: 6px; }
.plan-tools button { width: 40px; height: 40px; touch-action: manipulation; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 600; cursor: pointer; display: grid; place-items: center; }
.plan-zoom-label { padding: 3px; border-radius: 4px; background: var(--surface); font-size: 11px; text-align: center; }
.plan-tools button svg { width: 18px; height: 18px; }
.plan-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; padding: 20px; text-align: center; }
.hint { font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.hint b { color: var(--ink); }
.hint svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--accent); }

.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.strip .tile { width: 72px; flex: none; }

/* Foto singola */
.photo-wrap { background: #0b0f13; border-radius: var(--r); overflow: hidden; display: grid; place-items: center; min-height: 200px; }
.photo-wrap img { width: 100%; max-height: 70vh; object-fit: contain; display: block; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pager .pos { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }

/* Finestre */
.modal-back { position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: grid; align-items: end; justify-items: center; }
@media (min-width: 600px) { .modal-back { align-items: center; } }
.modal { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
@media (min-width: 600px) { .modal { border-radius: 16px; } }
.modal-title { font-family: var(--f-display); font-weight: 600; font-size: 20px; margin: 0; text-wrap: balance; }
.modal-text { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
.modal-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.modal-actions .btn { flex: 1 1 140px; }
.sheet-list { display: grid; gap: 4px; }
.sheet-list .btn { justify-content: flex-start; border-color: transparent; background: var(--surface-2); }

.toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--bar-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; justify-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 480px; box-shadow: 0 6px 20px rgba(0,0,0,.25); transition: opacity .3s, transform .3s; }
.toast.err { background: var(--danger); color: #fff; }
.toast.out { opacity: 0; transform: translateY(6px); }

/* Accesso */
.login { min-height: 100vh; display: grid; place-items: center; padding-block: 32px; }
.login-box { width: 100%; max-width: 420px; display: grid; gap: 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 52px; height: 52px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.brand-mark svg { width: 30px; height: 30px; }
.brand h1 { font-family: var(--f-display); font-size: 28px; margin: 0; line-height: 1.05; }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }
.spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; margin: 24px auto; }
@keyframes rot { to { transform: rotate(360deg); } }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.queue-item { display: grid; gap: 4px; padding: 12px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.queue-item:first-child { border-top: 0; }
.queue-item .err { color: var(--danger); font-size: 13px; overflow-wrap: anywhere; }

.btn.waiting { opacity: .55; }
.hint.flash { animation: flash .9s 2; }
@keyframes flash { 50% { background: var(--accent-soft); color: var(--ink); } }
@media (prefers-reduced-motion: reduce) { .hint.flash { animation: none; } }

/* Ricerca */
.search-box { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
.search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-box svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search-box input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 13px 0; font-size: 16px; outline: none; }
.search-status { margin: 0; }
.search-results { display: grid; gap: 16px; }
.search-results .section-label { margin: 0 0 -8px; }
.res-ico { width: 40px; height: 40px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.res-ico svg { width: 20px; height: 20px; }
.res-sub { font-weight: 400; color: var(--muted); font-size: 14px; }
.res-note { color: var(--ink); }
mark { background: color-mix(in srgb, var(--signal) 45%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }

/* Storico dei punti */
.timeline { scroll-margin-top: 72px; }
.tl-card { padding: 14px; display: grid; gap: 14px; }
.tl-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.tl-sum { font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.tl-range { font-size: 12.5px; color: var(--muted); }
.tl-list { display: grid; gap: 0; }
.tl-item { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; position: relative; padding-bottom: 16px; }
.tl-item::before { content: ""; position: absolute; left: 8px; top: 16px; bottom: 0; width: 2px; background: var(--line); }
.tl-item:last-child::before { display: none; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); margin: 5px 0 0 3px; box-shadow: 0 0 0 3px var(--accent-soft); }
.tl-body { display: grid; gap: 6px; min-width: 0; }
.tl-date { font-size: 12.5px; color: var(--muted); }
.tl-title { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; text-align: left; font-weight: 600; font-size: 15.5px; color: var(--ink); cursor: pointer; }
.tl-title svg { width: 16px; height: 16px; color: var(--muted); }

</style>

<style>
.fc-filters { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:12px 0; }
.fc-filters input,.fc-filters select,.fc-compare-controls select { width:100%; min-width:0; min-height:42px; border:1px solid var(--line,#ccc); border-radius:8px; padding:8px; background:var(--surface,#fff); color:var(--text,#111); }
.fc-compare { margin:16px 0 36px; }.fc-compare-controls,.fc-compare-images { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
.fc-compare-images img { width:100%; aspect-ratio:4/3; object-fit:contain; background:#222; border-radius:8px; }
@media(max-width:480px){.fc-filters {grid-template-columns:1fr}.fc-compare-controls{grid-template-columns:1fr}}
.fc-camera-overlay { position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,.9); display:flex; align-items:center; justify-content:center; padding:12px; }
.fc-camera-panel { width:min(100%,600px); display:grid; gap:12px; padding:12px; border-radius:16px; background:var(--surface,#fff); color:var(--text,#111); }
.fc-camera-panel video { object-fit:contain; }
@media (max-width:600px) { .fc-camera-panel { border-radius:10px; } .fc-camera-panel .btn.big { min-height:65px; } }
.shot-sync-status { display:block; position:absolute; bottom:0; left:0; right:0; font-size:10px;
  line-height:1.3; text-align:center; padding:4px 2px; color:#fff; background:rgba(0,0,0,.78); }
.shot-sync-status.err { background:#982e32; cursor:pointer; }
</style>
<div id="app"></div><div id="toasts" class="toasts" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   CONFIGURAZIONE — da compilare prima della pubblicazione (vedi LEGGIMI)
   Se CLIENT_ID o ROOT_FOLDER_ID sono vuoti l'app parte in MODALITÀ PROVA:
   tutto resta sul dispositivo e non serve alcun account.

// dell'app. Chunk UTF-8 sotto i 124 byte per proprietà, massimo 28 proprietà.
const PhotoDescription = {
  slots: 26,
  key(i) { return 'fc_m' + String(i).padStart(2, '0'); },
  encode(data, update = false) {
    const { nota, ...metadata } = data;
    const chunks = []; let chunk = '', bytes = 0;
    const encoder = new TextEncoder();
    for (const character of JSON.stringify(metadata)) {
      const size = encoder.encode(character).length;
      if (bytes + size > 100) { chunks.push(chunk); chunk = ''; bytes = 0; }
      chunk += character; bytes += size;
    }
    if (chunk) chunks.push(chunk);
    if (chunks.length > this.slots) throw new Error('Dati tecnici della foto troppo lunghi: la foto non è stata modificata.');
    const appProperties = { fc: 'foto', fc_meta: '1:' + chunks.length };
    for (let i = 0; i < this.slots; i++) {
      if (i < chunks.length) appProperties[this.key(i)] = chunks[i];
      else if (update) appProperties[this.key(i)] = null;
    }
    return { description: String(nota ?? ''), appProperties };
  },
  decode(file) {
    const marker = file.appProperties?.fc_meta;
    if (marker) {
      const match = /^1:(\d+)$/.exec(marker);
      const count = match ? +match[1] : 0;
      if (!count || count > this.slots) throw new Error('Formato dati della foto non supportato. Aggiorna l’app.');
      let json = '';
      for (let i = 0; i < count; i++) {
        const chunk = file.appProperties[this.key(i)];
        if (typeof chunk !== 'string') throw new Error('Dati tecnici della foto incompleti: nessun dato è stato sovrascritto.');
        json += chunk;
      }
      let data;
      try { data = JSON.parse(json); } catch { throw new Error('Dati tecnici della foto non leggibili.'); }
      if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('Dati tecnici della foto non validi.');
      return { ...data, nota: file.description || '' };
    }
    // Foto create dalle versioni precedenti: lettura senza migrazioni distruttive.
    try { const data = JSON.parse(file.description || '{}'); if (data && typeof data === 'object' && !Array.isArray(data)) return data; } catch {}
    return { nota: file.description || '' };
  },
};
const Drive = {
  FIELDS: 'id,name,description,createdTime,modifiedTime,parents,capabilities(canAddChildren),appProperties',
  async f(url, opts = {}) {
    const tok = await Auth.token(); let r;
    try { r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + tok } }); }
    catch { const e = new Error('Connessione assente'); e.offline = true; throw e; }
    if (r.status === 401) { Auth.tok = null; Auth.save(); const e = new Error('Accesso scaduto'); e.authNeeded = true; throw e; }
    if (!r.ok) {
      let msg = ''; try { msg = (await r.json()).error?.message || ''; } catch {}
      const e = new Error(r.status === 403 || r.status === 404 ? `Permesso negato da Google Drive${msg ? ' (' + msg + ')' : ''}` : `Google Drive ha risposto ${r.status}${msg ? ': ' + msg : ''}`);
      e.status = r.status; if (r.status >= 500 || r.status === 429) e.offline = true; throw e;
    }
    return r;
  },
  toEnt(f, kind, parentId) { let data = {}; if (kind === 'foto') data = PhotoDescription.decode(f); else { try { data = JSON.parse(f.description || '{}'); } catch {} } return { id: f.id, kind, parentId: parentId || (f.parents && f.parents[0]), data, created: f.createdTime, modified: f.modifiedTime, canAddChildren: f.capabilities?.canAddChildren, legacyPhotoDescription: kind === 'foto' && !f.appProperties?.fc_meta }; },
  nameFor(kind, d) {
    switch (kind) {
      case 'cantiere': return d.nome || 'Cantiere';
      case 'gruppo': return `${d.data || ''} ${d.titolo || ''}`.trim();
      case 'pianta': return `Planimetria - ${d.label || ''}.jpg`;
      case 'foto': { const t = new Date(d.taken); return isNaN(t) ? 'Foto.jpg' : `Foto ${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())} ${pad(t.getHours())}.${pad(t.getMinutes())}.${pad(t.getSeconds())}.jpg`; }
      default: return d.nome || 'file';
    }
  },
  async list(kind, parentId) {
    if (kind === 'cantiere' && !Access.isCreator()) {
      const out = [];
      for (const id of Access.assignedIds()) {
        const f = await this.siteInfo(id);
        if (f && !f.trashed && f.mimeType === 'application/vnd.google-apps.folder' && f.appProperties?.fc === 'cantiere') out.push(this.toEnt(f, kind, parentId));
      }
      return out;
    }
    const q = `'${parentId}' in parents and trashed=false and appProperties has { key='fc' and value='${kind}' }`;
    const out = []; let pt = '';
    do {
      const u = `${API}/files?q=${encodeURIComponent(q)}&fields=${encodeURIComponent('nextPageToken,files(' + this.FIELDS + ')')}&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true${pt ? '&pageToken=' + encodeURIComponent(pt) : ''}`;
      const j = await (await this.f(u)).json();
      out.push(...(j.files || []).map(f => this.toEnt(f, kind, parentId))); pt = j.nextPageToken || '';
    } while (pt);
    return out;
  },
  async create(kind, parentId, data, blob) {
    if (kind === 'cantiere') Access.requireCantiereCreator();
    const meta = { name: this.nameFor(kind, data), parents: [parentId], ...(kind === 'foto' ? PhotoDescription.encode(data) : { description: JSON.stringify(data), appProperties: { fc: kind } }) };
    const fields = '&fields=' + encodeURIComponent(this.FIELDS);
    let r;
    if (!blob) {
      meta.mimeType = 'application/vnd.google-apps.folder';
      r = await this.f(`${API}/files?supportsAllDrives=true${fields}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(meta) });
    } else {
      const b = 'fcb' + uid();
      const body = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${blob.type || 'application/octet-stream'}\r\n\r\n`, blob, `\r\n--${b}--`]);
      r = await this.f(`${UPL}/files?uploadType=multipart&supportsAllDrives=true${fields}`, { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body });
    }
    return this.toEnt(await r.json(), kind, parentId);
  },
  async update(kind, id, data) {
    // il nome del file di una foto non cambia mai (dipende solo da data e ora di scatto)
    const meta = kind === 'foto' ? PhotoDescription.encode(data, true) : { name: this.nameFor(kind, data), description: JSON.stringify(data) };
    const r = await this.f(`${API}/files/${id}?supportsAllDrives=true&fields=${encodeURIComponent(this.FIELDS)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(meta) });
    return this.toEnt(await r.json(), kind);
  },
  async remove(kind, id) { await this.f(`${API}/files/${id}?supportsAllDrives=true`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true }) }); },
  async getBlob(id) { return (await this.f(`${API}/files/${id}?alt=media&supportsAllDrives=true`)).blob(); },
  async whoami() { const j = await (await this.f(`${API}/about?fields=user(displayName,emailAddress)`)).json(); return { name: j.user?.displayName || '', email: (j.user?.emailAddress || '').toLowerCase() }; },
  async folderInfo(id) {
    try { return await (await this.f(`${API}/files/${encodeURIComponent(id)}?supportsAllDrives=true&fields=id,name,capabilities(canAddChildren)`)).json(); }
    catch (e) { if (e.status === 403 || e.status === 404) return null; throw e; }
  },
  async siteInfo(id) {
    try { return await (await this.f(`${API}/files/${encodeURIComponent(id)}?supportsAllDrives=true&fields=${encodeURIComponent(this.FIELDS + ',mimeType,trashed')}`)).json(); }
    catch (e) { if (e.status === 403 || e.status === 404) return null; throw e; }
  },
  async rootInfo() { return this.folderInfo(CONFIG.ROOT_FOLDER_ID); },
};

/* ---------- archivio di prova (tutto sul dispositivo) ---------- */
const Local = {
  async list(kind, parentId) { return (await IDB.all('ents')).map(e => e[1]).filter(e => e.kind === kind && e.parentId === parentId); },
  async create(kind, parentId, data, blob) {
    const now = new Date().toISOString(); const e = { id: 'L' + uid(), kind, parentId, data, created: now, modified: now };
    if (blob) await IDB.put('blobs', 'f:' + e.id, blob);
    await IDB.put('ents', e.id, e); return e;
  },
  async update(kind, id, data) { const e = await IDB.get('ents', id); if (!e) throw new Error('Elemento non trovato'); e.data = data; e.modified = new Date().toISOString(); await IDB.put('ents', id, e); return e; },
  async remove(kind, id) {
    const all = (await IDB.all('ents')).map(x => x[1]);
    const kill = async pid => { for (const c of all.filter(x => x.parentId === pid)) await kill(c.id); await IDB.del('ents', pid); await IDB.del('blobs', 'f:' + pid); };
    await kill(id);
  },
  async getBlob(id) { const b = await IDB.get('blobs', 'f:' + id); if (!b) throw new Error('File non trovato'); return b; },
};

/* ---------- Store: cache, coda dei caricamenti, lavoro senza rete ---------- */
const Store = {
  backend: null, idmap: {}, listeners: new Set(), urls: new Map(), forceOffline: false,
  status: { pending: 0, fotoPending: 0, net: 'ok', running: false, error: null },
  async init() {
    this.backend = MODE === 'drive' ? Drive : Local;
    this.idmap = (await IDB.get('kv', 'idmap')) || {};
    await this.refreshStatus();
    addEventListener('online', () => this.kick());
    setInterval(() => { if (this.status.pending) this.kick(); }, 20000);
    this.kick();
  },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit() { for (const f of this.listeners) { try { f(); } catch (e) { console.error(e); } } },
  isTemp(id) { return typeof id === 'string' && id.startsWith(TMP); },
  resolve(id) { let x = id, n = 0; while (x && this.idmap[x] && n++ < 6) x = this.idmap[x]; return x; },
  same(a, b) { return a != null && b != null && this.resolve(a) === this.resolve(b); },
  resolveRefs(d) { const o = {}; for (const [k, v] of Object.entries(d || {})) o[k] = this.isTemp(v) ? this.resolve(v) : v; return o; },
  net(fn) { if (this.forceOffline) { const e = new Error('Connessione assente (simulata)'); e.offline = true; return Promise.reject(e); } return fn(); },
  noteNet(e) { this.status.net = e.authNeeded ? 'auth' : 'offline'; if (e.authNeeded) setTimeout(() => Auth.maybeRenew('api'), 400); },
  async ops() { return (await IDB.all('queue')).map(x => x[1]); },

  async cachedList(kind, parentId) {
    const p = this.resolve(parentId);
    const items = this.isTemp(p) ? [] : await IDB.get('kv', `list:${kind}:${p}`);
    if (!items) return null;
    const result = await this.overlay(kind, parentId, items);
    return kind === 'cantiere' ? result.filter(c => Access.canReadCantiere(c)) : result;
  },
  async list(kind, parentId) {
    const p = this.resolve(parentId); let items = [];
    if (!this.isTemp(p)) {
      try {
        items = await this.net(() => this.backend.list(kind, p));
        if (kind === 'cantiere') Access.setSites(items);
        await IDB.put('kv', `list:${kind}:${p}`, items);
        if (this.status.net !== 'ok') { this.status.net = 'ok'; this.kick(); }
      } catch (e) {
        if (!(e.offline || e.authNeeded)) throw e;
        this.noteNet(e); this.emit();
        items = (await IDB.get('kv', `list:${kind}:${p}`)) || [];
      }
    }
    const result = await this.overlay(kind, parentId, items);
    return kind === 'cantiere' ? result.filter(c => Access.canReadCantiere(c)) : result;
  },
  async overlay(kind, parentId, items) {
    items = items.map(e => ({ ...e, data: { ...e.data } }));
    for (const op of await this.ops()) {
      if (op.kind !== kind) continue;
      if (op.type === 'create' && this.same(op.parentId, parentId)) {
        if (!items.some(i => this.same(i.id, op.tempId))) items.push({ id: op.tempId, kind, parentId: op.parentId, data: { ...op.data }, created: op.time, modified: op.time, pending: true, error: op.error || null });
      } else if (op.type === 'update') {
        const it = items.find(i => this.same(i.id, op.id)); if (it) { it.data = { ...op.data }; it.pending = true; it.error = op.error || null; }
      } else if (op.type === 'remove') {
        items = items.filter(i => !this.same(i.id, op.id));
      }
    }
    return items;
  },

  seq: 0,
  async enqueue(op) {
    op.key = Date.now().toString(36).padStart(10, '0') + (++this.seq).toString(36).padStart(4, '0');
    op.time = new Date().toISOString();
    await IDB.put('queue', op.key, op);
    await this.refreshStatus(); this.emit(); this.kick();
    return op;
  },
  async findCreateOp(id) { return (await this.ops()).find(o => o.type === 'create' && o.tempId === id); },
  async create(kind, parentId, data, blob) {
    if (kind === 'cantiere') Access.requireCantiereCreator();
    if (kind === 'gruppo') await Access.requireGroupWriter(parentId);
    const tempId = TMP + uid();
    if (kind === 'foto' && blob) {
      if (!await IDB.durable()) throw new Error('Archivio offline non disponibile: impossibile garantire il salvataggio della foto.');
      if (navigator.storage?.estimate) {
        const space = await navigator.storage.estimate();
        if (space.quota && space.usage != null && space.quota - space.usage < blob.size * 1.3)
          throw new Error('Spazio sul dispositivo insufficiente. Sincronizza le foto o libera memoria.');
      }
    }
    if (blob && navigator.storage?.persist) {
      try { await navigator.storage.persist(); } catch {}
    }
    if (blob) await IDB.put('blobs', 'q:' + tempId, blob);
    await this.enqueue({ type: 'create', kind, parentId, tempId, data, hasBlob: !!blob });
    return { id: tempId, kind, parentId, data, created: new Date().toISOString(), pending: true };
  },
  async update(ent, patch) {
    const data = { ...ent.data, ...patch };
    const cop = this.isTemp(this.resolve(ent.id)) ? await this.findCreateOp(ent.id) : null;
    if (cop) { cop.data = data; await IDB.put('queue', cop.key, cop); this.emit(); }
    else await this.enqueue({ type: 'update', kind: ent.kind, id: ent.id, data });
    ent.data = data; return ent;
  },
  async remove(ent) {
    const cop = this.isTemp(this.resolve(ent.id)) ? await this.findCreateOp(ent.id) : null;
    if (cop) { await IDB.del('queue', cop.key); await IDB.del('blobs', 'q:' + cop.tempId); await this.refreshStatus(); this.emit(); }
    else await this.enqueue({ type: 'remove', kind: ent.kind, id: ent.id });
  },

  async getBlob(ent) {
    const id = ent.id, r = this.resolve(id);
    for (const k of ['q:' + id, 'c:' + r]) { const b = await IDB.get('blobs', k); if (b) return b; }
    const b = await this.limit(() => this.net(() => this.backend.getBlob(r)));
    IDB.put('blobs', 'c:' + r, b).catch(() => {});
    return b;
  },
  active: 0, waiting: [],
  async limit(fn) {
    if (this.active >= 4) await new Promise(res => this.waiting.push(res));
    this.active++;
    try { return await fn(); } finally { this.active--; const n = this.waiting.shift(); if (n) n(); }
  },
  async thumbURL(ent) {
    const key = 't:' + this.resolve(ent.id);
    if (this.urls.has(key)) return this.urls.get(key);
    let t = await IDB.get('blobs', key);
    if (!t) { t = (await resizeToJpeg(await this.getBlob(ent), 420, 0.78)).blob; IDB.put('blobs', key, t).catch(() => {}); }
    const u = URL.createObjectURL(t); this.urls.set(key, u); return u;
  },
  async fullURL(ent) {
    const key = 'u:' + this.resolve(ent.id);
    if (this.urls.has(key)) return this.urls.get(key);
    const u = URL.createObjectURL(await this.getBlob(ent)); this.urls.set(key, u); return u;
  },
  async putThumb(ent, blob) { const t = (await resizeToJpeg(blob, 420, 0.78)).blob; await IDB.put('blobs', 't:' + ent.id, t); },

  running: false, again: false,
  async kick() {
    if (this.running) { this.again = true; return; }
    this.running = true; this.status.running = true; this.emit();
    try { do { this.again = false; await this.process(); } while (this.again); }
    catch (e) { console.error(e); }
    finally { this.running = false; this.status.running = false; await this.refreshStatus(); this.emit(); }
  },
  async process() {
    for (const op of await this.ops()) {
      if (op.error && (!op.retryAfter || Date.now() < op.retryAfter)) continue;
      // Mantiene l'ordine delle operazioni sullo stesso elemento senza
      // bloccare upload indipendenti per un errore non correlato.
      const previous = (await this.ops()).filter(o => o.key < op.key &&
        (o.tempId && o.tempId === op.id || o.id && o.id === op.id));
      if (previous.length) continue;
      try {
        await this.net(() => this.runOp(op));
        await IDB.del('queue', op.key);
        this.status.net = 'ok';
        await this.refreshStatus(); this.emit();
      } catch (e) {
        if (e.offline || e.authNeeded) { this.noteNet(e); return; }
        console.error(e);
        op.error = e.message || String(e);
        op.attempts = (op.attempts || 0) + 1;
        op.retryAfter = Date.now() + Math.min(15 * 60000, 10000 * Math.pow(2, Math.min(op.attempts - 1, 7)));
        await IDB.put('queue', op.key, op); await this.refreshStatus(); this.emit();
        continue;
      }
    }
  },
  async runOp(op) {
    const B = this.backend;
    if (op.type === 'create') {
      const parent = this.resolve(op.parentId);
      if (this.isTemp(parent)) { await IDB.del('blobs', 'q:' + op.tempId); return; } // genitore eliminato prima del caricamento
      let blob = null;
      if (op.hasBlob) { blob = await IDB.get('blobs', 'q:' + op.tempId); if (!blob) throw new Error('Il file da caricare non è più sul telefono'); }
      // Retry idempotente: se l'upload ha avuto successo ma la risposta si è persa,
      // cerca prima la fotografia per identificativo immutabile.
      let ent = null;
      if (op.kind === 'foto' && op.data.photoUid && MODE === 'drive') {
        const existing = await B.list('foto', parent);
        ent = existing.find(f => f.data.photoUid === op.data.photoUid) || null;
      }
      if (!ent) ent = await B.create(op.kind, parent, this.resolveRefs(op.data), blob);
      if (op.kind === 'cantiere') Access.siteIds?.add(ent.id);
      this.idmap[op.tempId] = ent.id; await IDB.put('kv', 'idmap', this.idmap);
      if (blob) { await IDB.put('blobs', 'c:' + ent.id, blob); await IDB.del('blobs', 'q:' + op.tempId); }
      const t = await IDB.get('blobs', 't:' + op.tempId);
      if (t) { await IDB.put('blobs', 't:' + ent.id, t); await IDB.del('blobs', 't:' + op.tempId); }
      const ck = `list:${op.kind}:${parent}`; const cl = (await IDB.get('kv', ck)) || [];
      cl.push(ent); await IDB.put('kv', ck, cl);
      if (op.kind === 'cantiere' && MODE === 'drive') await IDB.put('kv', 'access-sites:' + Access.email(), cl);
    } else if (op.type === 'update') {
      const id = this.resolve(op.id); if (this.isTemp(id)) return;
      const ent = await B.update(op.kind, id, this.resolveRefs(op.data));
      await this.patchCache(op.kind, id, list => list.map(i => i.id === id ? { ...i, data: ent.data, modified: ent.modified } : i));
    } else if (op.type === 'remove') {
      const id = this.resolve(op.id); if (this.isTemp(id)) return;
      try { await B.remove(op.kind, id); }
      catch (e) { if (e.status === 403) throw new Error('Google Drive non permette di eliminare questo elemento: in una cartella condivisa può eliminarlo solo chi lo ha caricato o il proprietario della cartella.'); throw e; }
      await this.patchCache(op.kind, id, list => list.filter(i => i.id !== id));
    }
  },
  async patchCache(kind, id, fn) {
    for (const [k, v] of await IDB.all('kv')) {
      if (k.startsWith(`list:${kind}:`) && Array.isArray(v) && v.some(i => i.id === id)) await IDB.put('kv', k, fn(v));
    }
  },
  async retry(op) { delete op.error; delete op.retryAfter; await IDB.put('queue', op.key, op); await this.refreshStatus(); this.emit(); this.kick(); },
  async discard(op) { await IDB.del('queue', op.key); if (op.tempId) await IDB.del('blobs', 'q:' + op.tempId); await this.refreshStatus(); this.emit(); this.kick(); },
  async refreshStatus() {
    const ops = await this.ops();
    this.status.pending = ops.length;
    this.status.fotoPending = ops.filter(o => o.type === 'create' && o.kind === 'foto').length;
    this.status.error = ops.find(o => o.error)?.error || null;
  },
  async clearCache() {
    for (const k of await IDB.keys('blobs')) if (/^[ct]:/.test(k)) await IDB.del('blobs', k);
    for (const u of this.urls.values()) URL.revokeObjectURL(u);
    this.urls.clear();
  },
};

/* ---------- foto: numerazione e punti ---------- */
// Ogni foto ha un numero progressivo del cantiere (data.num), assegnato allo scatto e mai ricalcolato.
// Le foto più vecchie senza numero ricevono un numero provvisorio in ordine di scatto.
const byTaken = (a, b) => String(a.data.taken || a.created).localeCompare(String(b.data.taken || b.created)) || String(a.created).localeCompare(String(b.created));
function numberFotos(fotos) {
  const sorted = [...fotos].sort((a, b) => {
    const na = a.data.num, nb = b.data.num;
    if (na != null && nb != null) return na - nb || byTaken(a, b);
    if (na != null) return -1; if (nb != null) return 1;
    return byTaken(a, b);
  });
  let fallback = 0;
  sorted.forEach(f => { f.n = f.data.num != null ? +f.data.num : ++fallback; });
  // I progressivi storici non si sovrascrivono. Un suffisso deterministico
  // rende inequivocabili i duplicati provenienti da dispositivi offline.
  const occurrences = new Map();
  for (const f of sorted) occurrences.set(f.n, (occurrences.get(f.n) || 0) + 1);
  for (const f of sorted) {
    f.reference = occurrences.get(f.n) > 1
      ? String(f.n) + ' · ' + String(f.data.photoUid || f.id).slice(-8)
      : String(f.n);
  }
  return sorted;
}
// Tutte le foto del cantiere, con il gruppo a cui appartengono.
async function cantiereFotos(cant, useNet) {
  if (!Access.canReadCantiere(cant)) throw new Error('Non sei autorizzato ad accedere a questo cantiere.');
  const list = async (kind, pid) => {

    const x = +d.x, y = +d.y;

      ctx.lineTo(ex + Math.sin(a - 2.5) * ha, ey - Math.cos(a - 2.5) * ha);

    const tw = Math.max(28 * unit, ctx.measureText(p.label).width + 16 * unit), th = 28 * unit;

    pdf.text('RAPPORTO FOTOGRAFICO', W - M, 12.5, { size: 8.5, bold: true, color: ACC, align: 'right' });
    pdf.text(fmtDay(grp.data.data), W - M, 17, { size: 7.5, color: MUTED, align: 'right' });
    pdf.line(M, 20.5, W - M, 20.5, { w: 0.5, color: ACC });
  };
  const newPage = () => { pdf.addPage(); header(); return TOP; };
  let y = newPage();

  // Titolo e dati
  for (const ln of pdf.wrap(grp.data.titolo || 'Gruppo foto', CW, 17, true)) { y += 7; pdf.text(ln, M, y, { size: 17, bold: true, color: INK }); }
  y += 5;
  const rows = [['Cantiere', cant.data.nome], ['Indirizzo', cant.data.indirizzo], ['Committente', cant.data.committente], ['Data', fmtDay(grp.data.data)], ['Numero foto', String(fotos.length)], ['Numeri foto', fotos.length ? `${fotos.map(f => f.reference || f.n).join(', ')} (numerazione del cantiere)` : ''], ['Redatto da', redattore]].filter(r => r[1]);
  pdf.line(M, y, W - M, y, { w: 0.2, color: LINE });
  for (const [k, v] of rows) {
    const lines = pdf.wrap(v, CW - 38, 10, false);
    pdf.text(k.toUpperCase(), M, y + 5, { size: 7.5, bold: true, color: MUTED });
    lines.forEach((ln, i) => pdf.text(ln, M + 38, y + 5 + i * 4.6, { size: 10, color: INK }));
    y += 3 + lines.length * 4.6 + 1.6; pdf.line(M, y, W - M, y, { w: 0.2, color: LINE });
  }
  if (grp.data.descrizione) {
    y += 7; pdf.text('DESCRIZIONE', M, y, { size: 7.5, bold: true, color: MUTED }); y += 1;
    for (const ln of pdf.wrap(grp.data.descrizione, CW, 10, false)) {

      const pts = groupPoints(fotos, p.id); if (!pts.length) continue;
      onProgress?.(`Planimetria ${p.data.label || ''}`);
      const im = await decodeImage(await Store.getBlob(p)); const { w: iw, h: ih } = imgSize(im);
      const s = Math.min(1, 2400 / Math.max(iw, ih)); const cw = Math.round(iw * s), ch = Math.round(ih * s);
      const c = document.createElement('canvas'); c.width = cw; c.height = ch;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch); ctx.drawImage(im, 0, 0, cw, ch); if (im.close) im.close();
      drawPinsCanvas(ctx, cw, ch, pts, Math.max(cw, ch) / 760);
      const jpg = pdf.addJpeg(await blobBytes(await canvasToBlob(c, 'image/jpeg', 0.88)));

      if (availH < Math.min(fitH, 110)) { y = newPage(); availH = BOT - (y + 14); }
      y += 9;
      pdf.text('PLANIMETRIA', M, y, { size: 7.5, bold: true, color: MUTED });
      pdf.text(p.data.label || '', M + 24, y, { size: 10, bold: true, color: INK, maxW: CW - 70 });
      pdf.text('Numeri = foto scattate in quel punto; freccia = direzione', W - M, y, { size: 7, color: MUTED, align: 'right' });
      y += 3;
      const sc = Math.min(CW / cw, (BOT - y) / ch); const dw = cw * sc, dh = ch * sc;

  const nameOf = id => { const p = piante.find(x => Store.same(x.id, id)); return p ? p.data.label : ''; };

function syncInfo() {

/* ---------- navigazione ---------- */
const Nav = {
  stack: [],
  top() { return this.stack[this.stack.length - 1]; },
  push(f) { const cur = this.top(); if (cur) cur.scrollY = window.scrollY; this.stack.push(f()); this.show(); },
  back() { const v = this.stack.pop(); v?.destroy?.(); if (!this.stack.length) this.stack.push(HomeView()); this.show(); },
  reset(f) { while (this.stack.length) this.stack.pop().destroy?.(); this.push(f); },
  route() { for (let i = this.stack.length - 1; i >= 0; i--) if (this.stack[i].route) return this.stack[i].route; return null; },
  pushMany(fs) { const cur = this.top(); if (cur) cur.scrollY = window.scrollY; for (const f of fs) this.stack.push(f()); this.show(); },
  show() { const v = this.top(); $('#app').replaceChildren(v.el); paintChips(); window.scrollTo(0, v.scrollY || 0); v.onShow?.(); },
};

/* ---------- Planimetria interattiva ---------- */
function PlanView({ pianta, points = [], interactive = false, onTap, onPointTap, height = '50vh' }) {
  const img = h('img', { alt: 'Planimetria', draggable: 'false' });
  const svg = sv('svg', { class: 'plan-pins', preserveAspectRatio: 'none' });
  const stage = h('div', { class: 'plan-stage' }, img, svg);
  const scroller = h('div', { class: 'plan-scroll', 'aria-label': 'Planimetria: zoom e spostamento indipendenti', role: 'group' }, stage);
  const msg = h('div', { class: 'plan-msg' }, 'Caricamento planimetria…');
  const zbtn = (lbl, label, fn) => h('button', { type: 'button', 'aria-label': label, onclick: fn }, lbl);
  const zoomLabel = h('span', { class: 'plan-zoom-label', 'aria-live': 'polite' }, '100%');
  const tools = h('div', { class: 'plan-tools' }, zbtn('+', 'Ingrandisci', () => setZoom(zoom * 1.5)), zbtn('−', 'Riduci', () => setZoom(zoom / 1.5)), zbtn(icon('fit'), 'Adatta', () => setZoom(1)), zoomLabel);
  const root = h('div', { class: 'plan', style: `--plan-h:${height}` }, scroller, msg, tools);
  let zoom = 1, natW = 0, natH = 0, pts = points;
  const baseW = () => { const bw = scroller.clientWidth, bh = scroller.clientHeight; return natW ? Math.min(bw, bh * natW / natH) : bw; };
  function imageAnchor(cx, cy) {
    const r = stage.getBoundingClientRect();
    return { x: (cx - r.left) / Math.max(1, r.width), y: (cy - r.top) / Math.max(1, r.height) };
  }
  function setZoom(z, cx, cy, fixedAnchor) {
    if (!natW) return;
    const r = scroller.getBoundingClientRect();

    const anchor = fixedAnchor || imageAnchor(cx, cy);
    zoom = Math.max(1, Math.min(10, z));
    stage.style.width = baseW() * zoom + 'px';
    const next = stage.getBoundingClientRect();
    scroller.scrollLeft += next.left + anchor.x * next.width - cx;
    scroller.scrollTop += next.top + anchor.y * next.height - cy;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    root.dataset.zoom = String(zoom);
    draw();
  }
  function draw() {
    if (!natW) return;
    svg.setAttribute('viewBox', `0 0 ${natW} ${natH}`); svg.replaceChildren();

    const g1 = sv('g'), g2 = sv('g');
    for (const p of pts) {
      const cx = p.x * natW, cy = p.y * natH;
      for (const d of (p.dirs || [])) {
        const a = d.ang * Math.PI / 180, L = 44 * u, ex = cx + Math.sin(a) * L, ey = cy - Math.cos(a) * L, ha = 11 * u;
        const col = p.active ? 'var(--signal)' : '#1f4f8f';
        g1.append(sv('line', { x1: cx, y1: cy, x2: ex, y2: ey, stroke: '#ffffff', 'stroke-width': 7 * u, 'stroke-linecap': 'round' }));
        g1.append(sv('line', { x1: cx, y1: cy, x2: ex, y2: ey, stroke: col, 'stroke-width': 4 * u, 'stroke-linecap': 'round' }));
        g1.append(sv('polygon', { points: [[ex + Math.sin(a) * ha * .6, ey - Math.cos(a) * ha * .6], [ex + Math.sin(a + 2.5) * ha, ey - Math.cos(a + 2.5) * ha], [ex + Math.sin(a - 2.5) * ha, ey - Math.cos(a - 2.5) * ha]].map(q => q.join(',')).join(' '), fill: col, stroke: '#ffffff', 'stroke-width': 1.5 * u }));
        if ((p.dirs || []).length > 1 && d.label) {
          const tx = cx + Math.sin(a) * (L + 17 * u), ty = cy - Math.cos(a) * (L + 17 * u), tw = (d.label.length * 7 + 8) * u;
          g1.append(sv('rect', { x: tx - tw / 2, y: ty - 8 * u, width: tw, height: 16 * u, rx: 3 * u, fill: '#ffffff' }));
          g1.append(sv('text', { x: tx, y: ty + 4.2 * u, 'text-anchor': 'middle', 'font-size': 12 * u, 'font-weight': 700, fill: '#1f4f8f', 'font-family': 'IBM Plex Mono, monospace' }, d.label));
        }
      }
      const lbl = p.label ?? '', tw = Math.max(26, lbl.length * 8 + 14) * u, th = 26 * u;
      const grp = sv('g', { class: onPointTap ? 'hit' : null });
      const sel = p.selected;
      grp.append(sv('rect', { x: cx - tw / 2, y: cy - th / 2, width: tw, height: th, rx: th / 2, fill: sel ? '#1f4f8f' : '#f2b705', stroke: sel ? '#ffffff' : '#1f1a08', 'stroke-width': (p.active || sel ? 3 : 2) * u }));
      if (lbl) grp.append(sv('text', { x: cx, y: cy + 4.6 * u, 'text-anchor': 'middle', 'font-size': 13.5 * u, 'font-weight': 700, fill: sel ? '#ffffff' : '#1f1a08', 'font-family': 'IBM Plex Mono, monospace' }, lbl));
      else grp.append(sv('circle', { cx, cy, r: 4 * u, fill: '#1f1a08' }));
      if (onPointTap) grp.addEventListener('click', e => { e.stopPropagation(); onPointTap(p); });
      g2.append(grp);
    }
    svg.append(g1, g2);
  }
  img.addEventListener('load', () => {
    natW = img.naturalWidth; natH = img.naturalHeight; msg.hidden = true;
    requestAnimationFrame(() => {
      const fitH = scroller.clientWidth * natH / natW;
      if (fitH < scroller.clientHeight) scroller.style.height = Math.max(180, Math.round(fitH)) + 'px';
      stage.style.width = baseW() + 'px'; draw();
    });
  });
  img.addEventListener('error', () => { msg.textContent = 'Planimetria non disponibile senza rete. Riprova quando c\'è connessione.'; });
  if (interactive) {
    img.addEventListener('click', e => { const r = img.getBoundingClientRect(); onTap?.(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)), natW, natH); });

  }
  // Gesti confinati alla pianta: il browser non deve ingrandire la pagina.
  let pinch = null, pan = null, safariPinch = null, suppressClick = false;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

    if (suppressClick) consume(e);

  scroller.addEventListener('click', e => { if (suppressClick) { e.preventDefault(); e.stopImmediatePropagation(); suppressClick = false; } }, true);
  scroller.addEventListener('gesturestart', e => {
    consume(e); const r = scroller.getBoundingClientRect();
    const x = e.clientX ?? r.left + r.width / 2, y = e.clientY ?? r.top + r.height / 2;

  scroller.addEventListener('gesturechange', e => {
    consume(e);

  }, { passive: false });
  scroller.addEventListener('gestureend', e => { consume(e); safariPinch = null; }, { passive: false });
  scroller.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) { consume(e); setZoom(zoom * Math.exp(-e.deltaY * 0.002), e.clientX, e.clientY); }

}

const PhotoNoteSync = {

    if (pending.length || Store.isTemp(Store.resolve(foto.id))) return { state: 'pending', message: 'Nota salvata nell’app, in attesa di sincronizzazione su Drive.' };

      if (!raw || raw.trashed) return { state: 'error', message: 'File non accessibile su Drive: nota non verificata.' };

    }
  },
};

async function migratePhotoDescriptions() {
  if (MODE !== 'drive' || !Access.isCreator()) return;
  if (!navigator.onLine) return toast('Serve una connessione per aggiornare le descrizioni su Drive.', 'err');
  const progress = busy('Verifica descrizioni foto…'); let updated = 0, failed = 0;
  try {
    const cantieri = await Store.list('cantiere', ROOT_ID);
    for (const cant of cantieri) {
      if (!Access.canWriteCantiere(cant)) continue;
      const gruppi = await Store.list('gruppo', cant.id);
      for (const grp of gruppi) {
        const fotos = await Store.list('foto', grp.id);
        for (const foto of fotos) {
          if (!foto.legacyPhotoDescription || foto.pending) continue;
          try {
            // Rilegge il file prima di accodare: preserva anche campi storici sconosciuti.
            const raw = await Drive.siteInfo(Store.resolve(foto.id));
            if (!raw || raw.trashed || raw.appProperties?.fc_meta) continue;
            const fresh = Drive.toEnt(raw, 'foto', grp.id);
            PhotoDescription.encode(fresh.data, true); // nessun accodamento se eccede i limiti Drive
            await Store.update(fresh, {}); updated++;
            progress.set(`${updated} descrizioni in aggiornamento`);
          } catch (e) { failed++; console.error(e); }
        }
      }
    }
    toast(`${updated} descrizioni accodate${failed ? ', ' + failed + ' non aggiornate' : ''}. Controlla lo stato dei caricamenti.`, failed ? 'err' : undefined);
  } catch (e) { toast('Aggiornamento interrotto: ' + e.message, 'err'); }
  finally { progress.close(); }
}

/* ---------- Ricerca ---------- */

      if (useNet) { try { return await Store.list(kind, pid); } catch (e) { if (!(e.offline || e.authNeeded)) throw e; this.partial = true; } }

    };

    const cantieri = await list('cantiere', ROOT_ID);
    let done = 0;

      items.push({ type: 'c', cant, own: [cant.data.nome, cant.data.indirizzo, cant.data.committente], ctx: [] });

      for (const p of piante) { items.push({ type: 'p', cant, pianta: p, own: [p.data.label], ctx: [cant.data.nome] }); counts.p++; }
      await runLimited(gruppi, 3, async grp => {
        items.push({ type: 'g', cant, grp, own: [grp.data.titolo, grp.data.descrizione, fmtDay(grp.data.data)], ctx: [cant.data.nome, cant.data.indirizzo] });
        counts.g++;
        const fotos = numberFotos(await list('foto', grp.id));
        for (const f of fotos) {
          const pl = piante.find(p => Store.same(p.id, f.data.pianta));
          items.push({ type: 'f', cant, grp, foto: f, fotos, own: [f.data.nota, f.data.autore, fmtDateTime(f.data.taken), 'foto ' + f.n], ctx: [grp.data.titolo, cant.data.nome, pl?.data.label] });

    const terms = norm(q).split(/\s+/).filter(Boolean);

    const out = [];
    for (const it of this.items) {
      if (!Access.canReadCantiere(it.cant)) continue;
      if (type && it.type !== type) continue;
      if (!terms.every(t => it.hay.includes(t))) continue;

function highlight(text, terms) {

}

            return h('button', { class: 'tile', type: 'button', 'aria-label': `Foto ${f.n}${f.data.nota ? ': ' + f.data.nota : ''}`, onclick: () => Nav.push(() => FotoView(cant, grp, all, Math.max(0, all.indexOf(f)))) },
              im, h('span', { class: 'num' }, f.reference || f.n), f.data.nota ? h('span', { class: 'cap' }, h('span', null, f.data.nota)) : null);

    one.onchange = two.onchange = update;

  function updateVisitOptions() {

      ...groups.map(g => h('option', { value: g.id }, g.data.titolo + ' · ' + fmtDay(g.data.data))));
    visitFilter.value = groups.some(g => g.id === selected) ? selected : '';
  }
  async function load() {
    piante = ((await Store.cachedList('pianta', cant.id)) || []).sort((a, b) => String(a.created).localeCompare(String(b.created)));
    if (!sel) sel = piante[0];
    if (!sel) { planBox.replaceChildren(h('div', { class: 'card empty' }, h('strong', null, 'Nessuna planimetria'), 'Carica una planimetria dalla scheda del cantiere.')); return; }
    render();
    data = await cantiereFotos(cant, false); updateVisitOptions(); render();
    if (navigator.onLine) { try { data = await cantiereFotos(cant, true); updateVisitOptions(); render(); } catch (e) { console.error(e); } }
  }
  let loaded = false;
  return { el, route: { c: cant.id }, onShow: () => { if (!loaded) { loaded = true; load(); } }, destroy: () => pv?.destroy() };
}

function drawDemoPlan() {
  const W = 2000, H = 1300, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#222'; x.lineCap = 'square';
  const wall = (pts, w) => { x.lineWidth = w; x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.stroke(); };
  wall([[150, 150], [1850, 150], [1850, 1150], [150, 1150], [150, 150]], 22);
  wall([[950, 150], [950, 520]], 12); wall([[950, 660], [950, 1150]], 12);
  wall([[950, 600], [1400, 600]], 12); wall([[1520, 600], [1850, 600]], 12);
  wall([[1350, 150], [1350, 380]], 10); wall([[1350, 470], [1350, 600]], 10);
  wall([[150, 760], [480, 760]], 12); wall([[600, 760], [950, 760]], 12);
  x.lineWidth = 3; x.strokeStyle = '#555';
  const door = (cx, cy, r, a0, a1) => { x.beginPath(); x.arc(cx, cy, r, a0, a1); x.stroke(); };
  door(950, 520, 140, Math.PI / 2, Math.PI); door(1400, 600, 120, Math.PI, 1.5 * Math.PI); door(480, 760, 120, -Math.PI / 2, 0); door(1350, 380, 90, 0, Math.PI / 2);
  x.fillStyle = '#9fc3e6'; [[400, 150, 260], [1550, 150, 200], [1850, 800, 220], [600, 1150, 260]].forEach(([a, b, l]) => { if (b === 150 || b === 1150) x.fillRect(a, b - 8, l, 16); else x.fillRect(a - 8, b, 16, l); });
  x.fillStyle = '#333'; x.font = '600 46px Helvetica, Arial, sans-serif'; x.textAlign = 'center';
  [['Soggiorno', 550, 450], ['Camera', 550, 980], ['Cucina', 1150, 380], ['Bagno', 1600, 380], ['Camera', 1400, 900]].forEach(([t, a, b]) => x.fillText(t, a, b));
  x.font = '30px Helvetica, Arial, sans-serif'; x.fillStyle = '#666';
  [['31,5 m²', 550, 500], ['16,8 m²', 550, 1030], ['14,2 m²', 1150, 430], ['6,1 m²', 1600, 430], ['18,0 m²', 1400, 950]].forEach(([t, a, b]) => x.fillText(t, a, b));
  x.textAlign = 'left'; x.font = '600 34px Helvetica, Arial, sans-serif'; x.fillStyle = '#b00'; x.fillText('ESEMPIO — PIANTA PIANO TERRA (non in scala)', 150, 100);
  x.strokeStyle = '#222'; x.lineWidth = 4; x.beginPath(); x.moveTo(1780, 1270); x.lineTo(1780, 1190); x.stroke();
  x.beginPath(); x.moveTo(1765, 1210); x.lineTo(1780, 1185); x.lineTo(1795, 1210); x.fill(); x.font = '600 28px Helvetica, Arial'; x.fillStyle = '#222'; x.fillText('N', 1805, 1215);
  return canvasToBlob(c, 'image/jpeg', 0.9);
}
function drawDemoPhoto(n, title, hue) {

  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, `hsl(${hue},12%,78%)`); g.addColorStop(0.62, `hsl(${hue},10%,68%)`); g.addColorStop(0.63, `hsl(${hue + 20},14%,48%)`); g.addColorStop(1, `hsl(${hue + 20},12%,36%)`);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(0,0,0,.18)'; x.lineWidth = 3;
  for (let i = 0; i < 9; i++) { x.beginPath(); x.moveTo(200 + i * 140, 760); x.lineTo(-400 + i * 300, H); x.stroke(); }
  x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(980, 180, 360, 420); x.strokeStyle = 'rgba(0,0,0,.35)'; x.lineWidth = 10; x.strokeRect(980, 180, 360, 420);
  x.strokeStyle = '#c2410c'; x.lineWidth = 14; x.beginPath(); x.moveTo(260, 740); x.lineTo(260, 330); x.lineTo(720, 330); x.stroke();
  x.fillStyle = 'rgba(15,20,25,.72)'; x.fillRect(0, 0, W, 170);
  x.fillStyle = '#fff'; x.font = '700 64px Helvetica, Arial, sans-serif'; x.fillText(`FOTO DI ESEMPIO ${n}`, 60, 100);
  x.font = '36px Helvetica, Arial, sans-serif'; x.fillStyle = '#f2b705'; x.fillText(title, 60, 150);

}

async function resetDemo() {
  if (MODE !== 'demo') return; // in modalità operativa non si cancella mai nulla dal telefono
  for (const s of ['ents', 'queue', 'kv', 'blobs']) await IDB.clear(s);
  Store.idmap = {}; Store.urls.clear(); await Store.refreshStatus(); await seedDemo();
}

async function boot() {
  let raf = false;
  Store.on(() => { paintChips(); if (raf) return; raf = true; setTimeout(() => { raf = false; paintChips(); Nav.top()?.onStore?.(); }, 60); });
  if (MODE === 'demo') {
    await seedDemo(); await Store.init(); Nav.reset(() => HomeView()); return;
  }
  Auth.load();
  const red = Auth.readRedirect();
  if (red?.error) return Nav.reset(() => LoginView(red.error));
  // All'apertura: se l'accesso è scaduto lo rinnova subito, senza chiedere nulla.
  if (!red && Auth.user && !Auth.valid() && Auth.canSilent() && navigator.onLine) { $('#app').replaceChildren(h('div', { class: 'spin' })); return Auth.start({ silent: true }); }
  if (red?.ok) {
    $('#app').replaceChildren(h('div', { class: 'spin' }));
    try {
      const user = await Drive.whoami();
      if (CONFIG.ALLOWED_EMAILS.length && !CONFIG.ALLOWED_EMAILS.map(e => e.toLowerCase()).includes(user.email)) { Auth.signOut(); return Nav.reset(() => LoginView(`L'account ${user.email} non è tra quelli autorizzati.`)); }
      if (Auth.user && Auth.user.email !== user.email) { await Store.clearCache(); for (const k of await IDB.keys('kv')) if (String(k).startsWith('list:')) await IDB.del('kv', k); }
      Auth.user = { ...user, readonly: true };
      await Access.refreshSession(); Auth.save();
    } catch (e) {
      if (!(red.silent && Auth.user && e.offline)) return Nav.reset(() => LoginView('Verifica dell\'accesso non riuscita: ' + e.message));
    }
  }
  if (!Auth.user) return Nav.reset(() => LoginView());
  if (Access.siteIds === null) {
    $('#app').replaceChildren(h('div', { class: 'spin' }));
    try { await Access.refreshSession(); }
    catch (e) { return Nav.reset(() => LoginView('Verifica dei cantieri autorizzati non riuscita: ' + e.message)); }
  }
  READONLY = !!Auth.user.readonly;
  await Store.init();
  if (red?.silentFailed) Store.status.net = 'auth';
  if (red) await restoreRoute(); else Nav.reset(() => HomeView());
  if (red?.silentFailed) setTimeout(() => toast('Accesso da riattivare: tocca il pallino arancione in alto'), 600);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    setTimeout(() => Auth.maybeRenew('resume'), 500);
    Access.refreshSession().then(() => {
      const route = Nav.route();
      if (route?.c && !Access.canReadCantiere({ id: route.c })) Nav.reset(() => HomeView());
      else Nav.top()?.onShow?.();
    }).catch(e => { console.error(e); Nav.reset(() => LoginView('Verifica dei permessi non riuscita. Riprova l\'accesso.')); });
  });
}

// Dopo il rinnovo dell'accesso riporta alla schermata in cui si era (cantiere o gruppo).
async function restoreRoute() {
  let r = null; try { r = JSON.parse(localStorage.getItem('fc_route') || 'null'); localStorage.removeItem('fc_route'); } catch {}
  const views = [() => HomeView()];
  try {
    if (r?.c) {
      const cant = ((await Store.cachedList('cantiere', ROOT_ID)) || []).find(x => Store.same(x.id, r.c));
      if (cant) {
        views.push(() => CantiereView(cant));
        if (r.g) {
          const grp = ((await Store.cachedList('gruppo', cant.id)) || []).find(x => Store.same(x.id, r.g));
          if (grp) views.push(() => GruppoView(cant, grp));
        }
      }
    }
  } catch (e) { console.error(e); }
  while (Nav.stack.length) Nav.stack.pop().destroy?.();
  Nav.pushMany(views);
}

window.addEventListener('error', e => console.error(e.error || e.message));
window.addEventListener('unhandledrejection', e => { console.error(e.reason); });
if ('serviceWorker' in navigator && !IN_ARTIFACT && location.protocol === 'https:' && MODE === 'drive') navigator.serviceWorker.register('sw.js').catch(() => {});
boot().catch(e => { console.error(e); $('#app').replaceChildren(h('div', { class: 'main gut' }, h('div', { class: 'notice err' }, h('strong', null, 'Avvio non riuscito. '), e.message))); });
