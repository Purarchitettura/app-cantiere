<style>
/* Layout: strumento da cantiere — barra superiore fissa, colonna unica, barra azioni in basso a portata di pollice */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --ink: #16202a;
  --muted: #5a6673;
  --line: #d6dce2;
  --accent: #1f4f8f;
  --accent-ink: #ffffff;
  --accent-soft: #e2ebf6;
  --signal: #f2b705;
  --signal-ink: #1f1a08;
  --ok: #2e7a4d;
  --warn: #9a5a06;
  --danger: #b3261e;
  --danger-soft: #fbe9e7;
  --overlay: rgba(12, 18, 24, .55);
  --f-display: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 10px;
  --bar-h: 76px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #18212a; --surface-2: #1e2933; --ink: #e5eaef; --muted: #9aa6b2;
    --line: #2c3844; --accent: #7aa9e8; --accent-ink: #0b1520; --accent-soft: #1d3150;
    --signal: #f2b705; --signal-ink: #1f1a08; --ok: #5cbf86; --warn: #e3a447; --danger: #f08a80;
    --danger-soft: #3a1f1d; --overlay: rgba(0, 0, 0, .65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #18212a; --surface-2: #1e2933; --ink: #e5eaef; --muted: #9aa6b2;
  --line: #2c3844; --accent: #7aa9e8; --accent-ink: #0b1520; --accent-soft: #1d3150;
  --signal: #f2b705; --signal-ink: #1f1a08; --ok: #5cbf86; --warn: #e3a447; --danger: #f08a80;
  --danger-soft: #3a1f1d; --overlay: rgba(0, 0, 0, .65); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Barra superiore */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; gap: 8px; min-height: 56px; padding-block: 6px; }
.bar-titles { flex: 1; min-width: 0; }
.bar-title { font-family: var(--f-display); font-weight: 600; font-size: 20px; line-height: 1.15; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 40px; height: 40px; flex: none; display: inline-grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.sync { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; flex: none; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.sync[data-s="busy"] .dot { background: var(--accent); animation: pulse 1s infinite alternate; }
.sync[data-s="offline"] .dot, .sync[data-s="auth"] .dot { background: var(--warn); }
.sync[data-s="error"] .dot { background: var(--danger); }
.sync[data-s="busy"], .sync[data-s="offline"], .sync[data-s="auth"], .sync[data-s="error"] { color: var(--ink); }
@keyframes pulse { to { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .sync[data-s="busy"] .dot { animation: none; } }

/* Contenuto */
.main { padding-block: 16px calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; max-width: 760px; margin: 0 auto; }
.main.no-bar { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.section-label { font-family: var(--f-display); font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 4px 0 -8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.list { display: grid; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 14px 14px; cursor: pointer; min-height: 64px; }
.list > .row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.row-sub { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.row-meta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.row svg.chev { width: 18px; height: 18px; color: var(--muted); flex: none; }
.row-thumb { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: 2px; margin-left: 6px; }
.tag.wait { background: var(--surface-2); color: var(--warn); border: 1px solid var(--line); }
.tag.err { background: var(--danger-soft); color: var(--danger); }
.empty { padding: 28px 20px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty strong { color: var(--ink); font-size: 16px; }
.notice { border: 1px solid var(--line); border-left: 4px solid var(--signal); background: var(--surface); padding: 10px 12px; border-radius: 8px; font-size: 13.5px; color: var(--muted); }
.notice strong { color: var(--ink); }
.notice.err { border-left-color: var(--danger); }
.info-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 14px; font-size: 14px; }
.info-grid dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.info-grid dd { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Segmenti */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 9px 8px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.seg button svg { width: 18px; height: 18px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Pulsanti */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.big { min-height: 54px; font-size: 16.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13.5px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 auto; }

.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.actionbar-in { display: flex; gap: 10px; max-width: 760px; margin: 0 auto; }
.actionbar-in .btn { flex: 1; }
.actionbar-in .btn.grow { flex: 2.2; }

/* Campi */
.field { display: grid; gap: 5px; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 11px 12px; font-size: 16px; }
.field textarea { min-height: 96px; resize: vertical; }
.field small { color: var(--muted); font-size: 12px; }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.form { display: grid; gap: 14px; }

/* Griglia foto */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { position: relative; aspect-ratio: 1; max-width: 100%; border: 0; padding: 0; border-radius: 7px; overflow: hidden; background: var(--surface-2); cursor: pointer; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .num { position: absolute; left: 5px; top: 5px; background: var(--signal); color: var(--signal-ink); font-family: var(--f-mono); font-weight: 600; font-size: 12px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; display: grid; place-items: center; }
.tile .state { position: absolute; right: 5px; top: 5px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); color: var(--warn); display: grid; place-items: center; }
.tile .state svg { width: 14px; height: 14px; }
.tile .state.err { color: var(--danger); }
.tile .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 6px 5px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.75)); text-align: left; }
.tile .cap span { font-size: 11.5px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sync.compact { padding: 0; width: 40px; height: 40px; justify-content: center; border: 0; background: transparent; }
.sync.compact .txt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.sync.compact .dot { width: 10px; height: 10px; }

/* Planimetria */
.plan { position: relative; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.plan-scroll { overflow: auto; height: var(--plan-h, 50vh); -webkit-overflow-scrolling: touch; display: grid; }
.plan-stage { position: relative; margin: auto; line-height: 0; }
.plan-stage img { width: 100%; display: block; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; background: #fff; }
.plan-pins { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.plan-pins .hit { pointer-events: auto; cursor: pointer; }
.plan-tools { position: absolute; right: 8px; bottom: 8px; display: grid; gap: 6px; }
.plan-tools button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 600; cursor: pointer; display: grid; place-items: center; }
.plan-tools button svg { width: 18px; height: 18px; }
.plan-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; padding: 20px; text-align: center; }
.hint { font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.hint b { color: var(--ink); }
.hint svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--accent); }

.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.strip .tile { width: 72px; flex: none; }

/* Foto singola */
.photo-wrap { background: #0b0f13; border-radius: var(--r); overflow: hidden; display: grid; place-items: center; min-height: 200px; }
.photo-wrap img { width: 100%; max-height: 70vh; object-fit: contain; display: block; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pager .pos { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }

/* Finestre */
.modal-back { position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: grid; align-items: end; justify-items: center; }
@media (min-width: 600px) { .modal-back { align-items: center; } }
.modal { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
@media (min-width: 600px) { .modal { border-radius: 16px; } }
.modal-title { font-family: var(--f-display); font-weight: 600; font-size: 20px; margin: 0; text-wrap: balance; }
.modal-text { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
.modal-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.modal-actions .btn { flex: 1 1 140px; }
.sheet-list { display: grid; gap: 4px; }
.sheet-list .btn { justify-content: flex-start; border-color: transparent; background: var(--surface-2); }

.toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--bar-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; justify-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 480px; box-shadow: 0 6px 20px rgba(0,0,0,.25); transition: opacity .3s, transform .3s; }
.toast.err { background: var(--danger); color: #fff; }
.toast.out { opacity: 0; transform: translateY(6px); }

/* Accesso */
.login { min-height: 100vh; display: grid; place-items: center; padding-block: 32px; }
.login-box { width: 100%; max-width: 420px; display: grid; gap: 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 52px; height: 52px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.brand-mark svg { width: 30px; height: 30px; }
.brand h1 { font-family: var(--f-display); font-size: 28px; margin: 0; line-height: 1.05; }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }
.spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; margin: 24px auto; }
@keyframes rot { to { transform: rotate(360deg); } }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.queue-item { display: grid; gap: 4px; padding: 12px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.queue-item:first-child { border-top: 0; }
.queue-item .err { color: var(--danger); font-size: 13px; overflow-wrap: anywhere; }

.btn.waiting { opacity: .55; }
.hint.flash { animation: flash .9s 2; }
@keyframes flash { 50% { background: var(--accent-soft); color: var(--ink); } }
@media (prefers-reduced-motion: reduce) { .hint.flash { animation: none; } }

/* Ricerca */
.search-box { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
.search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-box svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search-box input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 13px 0; font-size: 16px; outline: none; }
.search-status { margin: 0; }
.search-results { display: grid; gap: 16px; }
.search-results .section-label { margin: 0 0 -8px; }
.res-ico { width: 40px; height: 40px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.res-ico svg { width: 20px; height: 20px; }
.res-sub { font-weight: 400; color: var(--muted); font-size: 14px; }
.res-note { color: var(--ink); }
mark { background: color-mix(in srgb, var(--signal) 45%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }

</style>

const IDB = (() => {

    put: (st, k, v) => run(st, 'readwrite', os => os ? req(os.put(v, k)) : void mem[st].set(k, v)),
    del: (st, k) => run(st, 'readwrite', os => os ? req(os.delete(k)) : void mem[st].delete(k)),

    const out = []; let pt = '';

      const u = `${API}/files?q=${encodeURIComponent(q)}&fields=${encodeURIComponent('nextPageToken,files(' + this.FIELDS + ')')}&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true${pt ? '&pageToken=' + encodeURIComponent(pt) : ''}`;

  async create(kind, parentId, data, blob) {

  seq: 0,

    op.key = Date.now().toString(36).padStart(10, '0') + (++this.seq).toString(36).padStart(4, '0');
    op.time = new Date().toISOString();
    await IDB.put('queue', op.key, op);
    await this.refreshStatus(); this.emit(); this.kick();
    return op;
  },
  async findCreateOp(id) { return (await this.ops()).find(o => o.type === 'create' && o.tempId === id); },
  async create(kind, parentId, data, blob) {
    const tempId = TMP + uid();
    if (blob) await IDB.put('blobs', 'q:' + tempId, blob);
    await this.enqueue({ type: 'create', kind, parentId, tempId, data, hasBlob: !!blob });
    return { id: tempId, kind, parentId, data, created: new Date().toISOString(), pending: true };
  },
  async update(ent, patch) {
    const data = { ...ent.data, ...patch };
    const cop = this.isTemp(this.resolve(ent.id)) ? await this.findCreateOp(ent.id) : null;
    if (cop) { cop.data = data; await IDB.put('queue', cop.key, cop); this.emit(); }
    else await this.enqueue({ type: 'update', kind: ent.kind, id: ent.id, data });
    ent.data = data; return ent;
  },
  async remove(ent) {
    const cop = this.isTemp(this.resolve(ent.id)) ? await this.findCreateOp(ent.id) : null;
    if (cop) { await IDB.del('queue', cop.key); await IDB.del('blobs', 'q:' + cop.tempId); await this.refreshStatus(); this.emit(); }
    else await this.enqueue({ type: 'remove', kind: ent.kind, id: ent.id });
  },

  async getBlob(ent) {
    const id = ent.id, r = this.resolve(id);
    for (const k of ['q:' + id, 'c:' + r]) { const b = await IDB.get('blobs', k); if (b) return b; }
    const b = await this.limit(() => this.net(() => this.backend.getBlob(r)));
    IDB.put('blobs', 'c:' + r, b).catch(() => {});
    return b;
  },
  active: 0, waiting: [],
  async limit(fn) {
    if (this.active >= 4) await new Promise(res => this.waiting.push(res));
    this.active++;
    try { return await fn(); } finally { this.active--; const n = this.waiting.shift(); if (n) n(); }
  },
  async thumbURL(ent) {
    const key = 't:' + this.resolve(ent.id);
    if (this.urls.has(key)) return this.urls.get(key);
    let t = await IDB.get('blobs', key);
    if (!t) { t = (await resizeToJpeg(await this.getBlob(ent), 420, 0.78)).blob; IDB.put('blobs', key, t).catch(() => {}); }
    const u = URL.createObjectURL(t); this.urls.set(key, u); return u;
  },
  async fullURL(ent) {
    const key = 'u:' + this.resolve(ent.id);
    if (this.urls.has(key)) return this.urls.get(key);
    const u = URL.createObjectURL(await this.getBlob(ent)); this.urls.set(key, u); return u;
  },
  async putThumb(ent, blob) { const t = (await resizeToJpeg(blob, 420, 0.78)).blob; await IDB.put('blobs', 't:' + ent.id, t); },

  running: false, again: false,
  async kick() {
    if (this.running) { this.again = true; return; }
    this.running = true; this.status.running = true; this.emit();
    try { do { this.again = false; await this.process(); } while (this.again); }
    catch (e) { console.error(e); }
    finally { this.running = false; this.status.running = false; await this.refreshStatus(); this.emit(); }
  },
  async process() {
    for (const op of await this.ops()) {
      if (op.error) return;
      try {
        await this.net(() => this.runOp(op));
        await IDB.del('queue', op.key);
        this.status.net = 'ok';
        await this.refreshStatus(); this.emit();
      } catch (e) {
        if (e.offline || e.authNeeded) { this.noteNet(e); return; }
        console.error(e);
        op.error = e.message || String(e); await IDB.put('queue', op.key, op); return;
      }
    }
  },
  async runOp(op) {
    const B = this.backend;
    if (op.type === 'create') {
      const parent = this.resolve(op.parentId);
      if (this.isTemp(parent)) { await IDB.del('blobs', 'q:' + op.tempId); return; } // genitore eliminato prima del caricamento
      let blob = null;
      if (op.hasBlob) { blob = await IDB.get('blobs', 'q:' + op.tempId); if (!blob) throw new Error('Il file da caricare non è più sul telefono'); }
      const ent = await B.create(op.kind, parent, this.resolveRefs(op.data), blob);
      this.idmap[op.tempId] = ent.id; await IDB.put('kv', 'idmap', this.idmap);
      if (blob) { await IDB.put('blobs', 'c:' + ent.id, blob); await IDB.del('blobs', 'q:' + op.tempId); }
      const t = await IDB.get('blobs', 't:' + op.tempId);
      if (t) { await IDB.put('blobs', 't:' + ent.id, t); await IDB.del('blobs', 't:' + op.tempId); }
      const ck = `list:${op.kind}:${parent}`; const cl = (await IDB.get('kv', ck)) || [];
      cl.push(ent); await IDB.put('kv', ck, cl);
    } else if (op.type === 'update') {
      const id = this.resolve(op.id); if (this.isTemp(id)) return;
      const ent = await B.update(op.kind, id, this.resolveRefs(op.data));
      await this.patchCache(op.kind, id, list => list.map(i => i.id === id ? { ...i, data: ent.data, modified: ent.modified } : i));
    } else if (op.type === 'remove') {
      const id = this.resolve(op.id); if (this.isTemp(id)) return;
      try { await B.remove(op.kind, id); }
      catch (e) { if (e.status === 403) throw new Error('Google Drive non permette di eliminare questo elemento: in una cartella condivisa può eliminarlo solo chi lo ha caricato o il proprietario della cartella.'); throw e; }
      await this.patchCache(op.kind, id, list => list.filter(i => i.id !== id));
    }
  },
  async patchCache(kind, id, fn) {
    for (const [k, v] of await IDB.all('kv')) {
      if (k.startsWith(`list:${kind}:`) && Array.isArray(v) && v.some(i => i.id === id)) await IDB.put('kv', k, fn(v));
    }
  },
  async retry(op) { delete op.error; await IDB.put('queue', op.key, op); await this.refreshStatus(); this.emit(); this.kick(); },
  async discard(op) { await IDB.del('queue', op.key); if (op.tempId) await IDB.del('blobs', 'q:' + op.tempId); await this.refreshStatus(); this.emit(); this.kick(); },
  async refreshStatus() {
    const ops = await this.ops();
    this.status.pending = ops.length;
    this.status.fotoPending = ops.filter(o => o.type === 'create' && o.kind === 'foto').length;
    this.status.error = ops.find(o => o.error)?.error || null;
  },
  async clearCache() {
    for (const k of await IDB.keys('blobs')) if (/^[ct]:/.test(k)) await IDB.del('blobs', k);
    for (const u of this.urls.values()) URL.revokeObjectURL(u);
    this.urls.clear();
  },
};

/* ---------- foto: numerazione e punti ---------- */
function numberFotos(fotos) {
  const sorted = [...fotos].sort((a, b) => String(a.data.taken || a.created).localeCompare(String(b.data.taken || b.created)) || String(a.created).localeCompare(String(b.created)));
  sorted.forEach((f, i) => { f.n = i + 1; });
  return sorted;
}
function groupPoints(fotos, piantaId) {
  const m = new Map();
  for (const f of fotos) {
    const d = f.data;
    if (!d.pianta || !Store.same(d.pianta, piantaId) || d.x == null || d.y == null) continue;
    const k = `${(+d.x).toFixed(4)}|${(+d.y).toFixed(4)}`;
    if (!m.has(k)) m.set(k, { x: +d.x, y: +d.y, nums: [], fotos: [], dirs: new Map() });
    const g = m.get(k); g.nums.push(f.n); g.fotos.push(f);
    if (d.ang != null && d.ang !== '') { const a = Math.round(+d.ang); if (!g.dirs.has(a)) g.dirs.set(a, []); g.dirs.get(a).push(f.n); }
  }
  return [...m.values()].map(g => ({ ...g, label: rangeLabel(g.nums), dirs: [...g.dirs.entries()].map(([ang, nums]) => ({ ang, label: rangeLabel(nums) })) }));
}

  const sp = SPECIAL_W[ch]; if (sp) return sp[bold ? 1 : 0];

  const base = ch.normalize('NFD')[0]; c = base.charCodeAt(0);
  if (base !== ch && c >= 32 && c <= 126) return HELV_W[bold ? 'b' : 'r'][c - 32];

}

  const out = [];
  for (const ch of str) {
    const c = ch.charCodeAt(0);
    if (WIN_SPECIAL[ch]) out.push(WIN_SPECIAL[ch]);
    else if ((c >= 32 && c <= 126) || (c >= 160 && c <= 255)) out.push(c);

}

  let i = 2;
  while (i < bytes.length) {
    if (bytes[i] !== 0xFF) { i++; continue; }
    const m = bytes[i + 1];
    if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) return { h: (bytes[i + 5] << 8) | bytes[i + 6], w: (bytes[i + 7] << 8) | bytes[i + 8], nc: bytes[i + 9] };
    i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);

}

class PDFDoc {
  constructor(title) { this.pages = []; this.images = []; this.W = 210; this.H = 297; this.k = 72 / 25.4; this.title = title || ''; }
  addPage() { const p = { ops: [] }; this.pages.push(p); this.p = p; return p; }
  X(mm) { return (mm * this.k).toFixed(2); }
  Y(mm) { return ((this.H - mm) * this.k).toFixed(2); }
  rgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => (v / 255).toFixed(3)).join(' '); }
  width(str, size, bold) { let w = 0; for (const ch of pdfClean(str)) w += charW(ch, bold); return w / 1000 * size / this.k; }
  text(str, x, y, o = {}) {
    const size = o.size || 10, bold = !!o.bold; str = pdfClean(str).replace(/\n/g, ' ');
    if (o.maxW && this.width(str, size, bold) > o.maxW) { while (str.length > 1 && this.width(str + '…', size, bold) > o.maxW) str = str.slice(0, -1); str += '…'; }
    const w = this.width(str, size, bold);
    if (o.align === 'right') x -= w; else if (o.align === 'center') x -= w / 2;
    const hex = encWin(str).map(c => c.toString(16).padStart(2, '0')).join('');
    this.p.ops.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${this.rgb(o.color || '#000000')} rg ${this.X(x)} ${this.Y(y)} Td <${hex}> Tj ET`);
    return w;
  }
  wrap(str, maxW, size, bold) {
    const lines = [];
    for (const para of pdfClean(str).split('\n')) {
      const words = para.split(/ +/); let line = '';
      if (!para.trim()) { lines.push(''); continue; }
      for (let w of words) {
        while (this.width(w, size, bold) > maxW) {
          let i = w.length; while (i > 1 && this.width(w.slice(0, i), size, bold) > maxW) i--;
          if (line) { lines.push(line); line = ''; }
          lines.push(w.slice(0, i)); w = w.slice(i);
        }
        const t = line ? line + ' ' + w : w;
        if (this.width(t, size, bold) <= maxW) line = t; else { lines.push(line); line = w; }
      }
      lines.push(line);
    }
    return lines;
  }
  line(x1, y1, x2, y2, o = {}) { this.p.ops.push(`${this.rgb(o.color || '#000000')} RG ${((o.w || 0.2) * this.k).toFixed(2)} w ${this.X(x1)} ${this.Y(y1)} m ${this.X(x2)} ${this.Y(y2)} l S`); }
  rect(x, y, w, hh, o = {}) {
    const r = `${this.X(x)} ${this.Y(y + hh)} ${(w * this.k).toFixed(2)} ${(hh * this.k).toFixed(2)} re`;
    if (o.fill && o.stroke) this.p.ops.push(`${this.rgb(o.fill)} rg ${this.rgb(o.stroke)} RG ${((o.w || 0.2) * this.k).toFixed(2)} w ${r} B`);

  }

  image(im, x, y, w, hh) { this.p.ops.push(`q ${(w * this.k).toFixed(2)} 0 0 ${(hh * this.k).toFixed(2)} ${this.X(x)} ${this.Y(y + hh)} cm /${im.name} Do Q`); }
  output() {
    const enc = new TextEncoder(); const objs = [null, null];
    const add = parts => { objs.push(parts); return objs.length; };
    const F1 = add(['<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>']);
    const F2 = add(['<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>']);
    for (const im of this.images) {
      const cs = im.nc === 1 ? '/DeviceGray' : im.nc === 4 ? '/DeviceCMYK /Decode [1 0 1 0 1 0 1 0]' : '/DeviceRGB';
      im.id = add([`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace ${cs} /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`, im.bytes, '\nendstream']);
    }
    const xo = this.images.map(im => `/${im.name} ${im.id} 0 R`).join(' ');
    const kids = [];
    for (const p of this.pages) {
      const content = p.ops.join('\n');
      const cid = add([`<< /Length ${content.length} >>\nstream\n`, content, '\nendstream']);
      kids.push(add([`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 ${F1} 0 R /F2 ${F2} 0 R >> /XObject << ${xo} >> >> /Contents ${cid} 0 R >>`]));
    }
    objs[0] = ['<< /Type /Catalog /Pages 2 0 R >>'];
    objs[1] = [`<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`];
    const d = new Date(); const ds = `D:${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    const titleHex = 'FEFF' + [...pdfClean(this.title)].map(ch => { const c = ch.codePointAt(0); return c > 0xFFFF ? '003F' : c.toString(16).padStart(4, '0'); }).join('');

/* ---------- disegno dei punti sulla planimetria (per PDF) ---------- */
function drawPinsCanvas(ctx, W, H, points, unit) {
  const ACC = '#1f4f8f', SIG = '#f2b705';
  for (const p of points) {
    const cx = p.x * W, cy = p.y * H;
    for (const d of p.dirs) {
      const a = d.ang * Math.PI / 180, L = 46 * unit;
      const ex = cx + Math.sin(a) * L, ey = cy - Math.cos(a) * L;
      ctx.strokeStyle = ACC; ctx.fillStyle = ACC; ctx.lineWidth = 4 * unit; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
      const ha = 11 * unit; ctx.beginPath();
      ctx.moveTo(ex + Math.sin(a) * ha * 0.6, ey - Math.cos(a) * ha * 0.6);
      ctx.lineTo(ex + Math.sin(a + 2.5) * ha, ey - Math.cos(a + 2.5) * ha);
      ctx.lineTo(ex + Math.sin(a - 2.5) * ha, ey - Math.cos(a - 2.5) * ha);
      ctx.closePath(); ctx.fill();
      if (p.dirs.length > 1) {
        ctx.font = `600 ${13 * unit}px Helvetica, Arial, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const tx = cx + Math.sin(a) * (L + 18 * unit), ty = cy - Math.cos(a) * (L + 18 * unit);
        const tw = ctx.measureText(d.label).width + 8 * unit;
        ctx.fillStyle = '#ffffff'; ctx.fillRect(tx - tw / 2, ty - 9 * unit, tw, 18 * unit);
        ctx.fillStyle = ACC; ctx.fillText(d.label, tx, ty);
      }
    }
  }
  for (const p of points) {
    const cx = p.x * W, cy = p.y * H;
    ctx.font = `700 ${15 * unit}px Helvetica, Arial, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = Math.max(28 * unit, ctx.measureText(p.label).width + 16 * unit), th = 28 * unit;
    ctx.fillStyle = SIG; ctx.strokeStyle = '#1f1a08'; ctx.lineWidth = 2.2 * unit;
    roundRect(ctx, cx - tw / 2, cy - th / 2, tw, th, th / 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1f1a08'; ctx.fillText(p.label, cx, cy + 0.5 * unit);
  }
}
function roundRect(ctx, x, y, w, hh, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
async function blobBytes(b) { return new Uint8Array(await b.arrayBuffer()); }

/* ---------- rapporto fotografico ---------- */
async function buildReport({ cant, grp, fotos, piante, perPage, withPlans, redattore, intestazione, contatti, onProgress }) {
  const INK = '#16202a', MUTED = '#5a6673', ACC = '#1f4f8f', LINE = '#c9d1d9', SIG = '#f2b705';
  const pdf = new PDFDoc(`Rapporto fotografico - ${cant.data.nome} - ${grp.data.titolo}`);
  const M = 14, W = 210, H = 297, CW = W - 2 * M, TOP = 27, BOT = H - 16;
  const header = () => {
    pdf.text(intestazione || '', M, 12.5, { size: 11, bold: true, color: INK, maxW: CW * 0.62 });
    if (contatti) pdf.text(contatti, M, 17, { size: 7.2, color: MUTED, maxW: CW * 0.66 });
    pdf.text('RAPPORTO FOTOGRAFICO', W - M, 12.5, { size: 8.5, bold: true, color: ACC, align: 'right' });
    pdf.text(fmtDay(grp.data.data), W - M, 17, { size: 7.5, color: MUTED, align: 'right' });
    pdf.line(M, 20.5, W - M, 20.5, { w: 0.5, color: ACC });
  };
  const newPage = () => { pdf.addPage(); header(); return TOP; };
  let y = newPage();

  // Titolo e dati
  for (const ln of pdf.wrap(grp.data.titolo || 'Gruppo foto', CW, 17, true)) { y += 7; pdf.text(ln, M, y, { size: 17, bold: true, color: INK }); }
  y += 5;
  const rows = [['Cantiere', cant.data.nome], ['Indirizzo', cant.data.indirizzo], ['Committente', cant.data.committente], ['Data', fmtDay(grp.data.data)], ['Numero foto', String(fotos.length)], ['Redatto da', redattore]].filter(r => r[1]);
  pdf.line(M, y, W - M, y, { w: 0.2, color: LINE });
  for (const [k, v] of rows) {
    const lines = pdf.wrap(v, CW - 38, 10, false);
    pdf.text(k.toUpperCase(), M, y + 5, { size: 7.5, bold: true, color: MUTED });
    lines.forEach((ln, i) => pdf.text(ln, M + 38, y + 5 + i * 4.6, { size: 10, color: INK }));
    y += 3 + lines.length * 4.6 + 1.6; pdf.line(M, y, W - M, y, { w: 0.2, color: LINE });
  }
  if (grp.data.descrizione) {
    y += 7; pdf.text('DESCRIZIONE', M, y, { size: 7.5, bold: true, color: MUTED }); y += 1;
    for (const ln of pdf.wrap(grp.data.descrizione, CW, 10, false)) {
      if (y + 5 > BOT) y = newPage();
      y += 4.8; pdf.text(ln, M, y, { size: 10, color: INK });
    }
  }

  // Planimetrie con i punti di ripresa
  if (withPlans) {
    for (const p of piante) {
      const pts = groupPoints(fotos, p.id); if (!pts.length) continue;
      onProgress?.(`Planimetria ${p.data.label || ''}`);
      const im = await decodeImage(await Store.getBlob(p)); const { w: iw, h: ih } = imgSize(im);
      const s = Math.min(1, 2400 / Math.max(iw, ih)); const cw = Math.round(iw * s), ch = Math.round(ih * s);
      const c = document.createElement('canvas'); c.width = cw; c.height = ch;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch); ctx.drawImage(im, 0, 0, cw, ch); if (im.close) im.close();
      drawPinsCanvas(ctx, cw, ch, pts, Math.max(cw, ch) / 760);
      const jpg = pdf.addJpeg(await blobBytes(await canvasToBlob(c, 'image/jpeg', 0.88)));
      let availH = BOT - (y + 14);
      const fitH = Math.min(CW * ch / cw, 230);
      if (availH < Math.min(fitH, 110)) { y = newPage(); availH = BOT - (y + 14); }
      y += 9;
      pdf.text('PLANIMETRIA', M, y, { size: 7.5, bold: true, color: MUTED });
      pdf.text(p.data.label || '', M + 24, y, { size: 10, bold: true, color: INK, maxW: CW - 70 });
      pdf.text('Numeri = foto scattate in quel punto; freccia = direzione', W - M, y, { size: 7, color: MUTED, align: 'right' });
      y += 3;
      const sc = Math.min(CW / cw, (BOT - y) / ch); const dw = cw * sc, dh = ch * sc;

      y += dh;

    const f = fotos[i]; const slot = i % perPage;
    if (slot === 0) gy = newPage() + 2;
    const col = slot % cols, row = Math.floor(slot / cols); lastRow = row;
    const x = M + col * (cellW + gap), yy = gy + row * (cellH + gap);
    onProgress?.(`Foto ${i + 1} di ${fotos.length}`, (i + 1) / fotos.length);
    try {
      const r = await resizeToJpeg(await Store.getBlob(f), pxMax, 0.82);
      const jpg = pdf.addJpeg(await blobBytes(r.blob));
      const sc = Math.min(cellW / r.w, boxH / r.h); const dw = r.w * sc, dh = r.h * sc;
      const ix = x + (cellW - dw) / 2, iy = yy + boxH - dh;
      pdf.image(jpg, ix, iy, dw, dh); pdf.rect(ix, iy, dw, dh, { stroke: LINE, w: 0.2 });
    } catch (e) {
      pdf.rect(x, yy, cellW, boxH, { stroke: LINE, w: 0.3 });
      pdf.text('Foto non disponibile su questo dispositivo', x + cellW / 2, yy + boxH / 2, { size: 9, color: MUTED, align: 'center' });
    }
    let cy = yy + boxH + 5.2;
    const lbl = `Foto n. ${f.n}`;
    pdf.rect(x, cy - 3.6, 2.2, 4.6, { fill: SIG });
    pdf.text(lbl, x + 4, cy, { size: 9.5, bold: true, color: INK });
    pdf.text(fmtDateTime(f.data.taken), x + cellW, cy, { size: 7.8, color: MUTED, align: 'right' });
    const where = f.data.pianta ? `Planimetria: ${nameOf(f.data.pianta)}` : 'Senza punto su planimetria';
    cy += 4; pdf.text(where + (f.data.autore ? ` · ${f.data.autore}` : ''), x, cy, { size: 7.5, color: MUTED, maxW: cellW });

      let lines = pdf.wrap(f.data.nota, cellW, 8.6, false);
      if (lines.length > maxLines) { lines = lines.slice(0, maxLines); lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, '') + ' […]'; }
      for (const ln of lines) { cy += 3.9; pdf.text(ln, x, cy, { size: 8.6, color: INK }); }

  }

  // Firma
  let sy;
  if (fotos.length) { const used = gy + (lastRow + 1) * (cellH + gap); sy = (fotos.length % perPage === 0 || BOT - used < 34) ? newPage() + 4 : used; }
  else sy = BOT - y < 40 ? newPage() + 4 : y + 6;
  sy += 8;
  pdf.text(`Data: ${fmtDay(todayISO())}`, M, sy + 6, { size: 9.5, color: INK });
  pdf.text('Il tecnico', W - M - 35, sy, { size: 8, color: MUTED, align: 'center' });
  pdf.text(redattore || '', W - M - 35, sy + 6, { size: 10, bold: true, color: INK, align: 'center' });
  pdf.line(W - M - 70, sy + 20, W - M, sy + 20, { w: 0.3, color: INK });

  // Piè di pagina
  const n = pdf.pages.length;
  pdf.pages.forEach((pg, i) => {
    pdf.p = pg;
    pdf.line(M, H - 12, W - M, H - 12, { w: 0.2, color: LINE });
    pdf.text(`${cant.data.nome} — ${grp.data.titolo}`, M, H - 8, { size: 7, color: MUTED, maxW: CW - 30 });
    pdf.text(`Pag. ${i + 1} di ${n}`, W - M, H - 8, { size: 7, color: MUTED, align: 'right' });
  });
  return pdf.output();
}

const Nav = {

  back() { const v = this.stack.pop(); v?.destroy?.(); if (!this.stack.length) this.stack.push(HomeView()); this.show(); },
  reset(f) { while (this.stack.length) this.stack.pop().destroy?.(); this.push(f); },
  route() { for (let i = this.stack.length - 1; i >= 0; i--) if (this.stack[i].route) return this.stack[i].route; return null; },
  pushMany(fs) { const cur = this.top(); if (cur) cur.scrollY = window.scrollY; for (const f of fs) this.stack.push(f()); this.show(); },

function PlanView({ pianta, points = [], interactive = false, onTap, onPointTap, height = '50vh' }) {
  const img = h('img', { alt: 'Planimetria', draggable: 'false' });
  const svg = sv('svg', { class: 'plan-pins', preserveAspectRatio: 'none' });
  const stage = h('div', { class: 'plan-stage' }, img, svg);
  const scroller = h('div', { class: 'plan-scroll' }, stage);
  const msg = h('div', { class: 'plan-msg' }, 'Caricamento planimetria…');
  const zbtn = (lbl, label, fn) => h('button', { type: 'button', 'aria-label': label, onclick: fn }, lbl);
  const tools = h('div', { class: 'plan-tools' }, zbtn('+', 'Ingrandisci', () => setZoom(zoom * 1.5)), zbtn('−', 'Riduci', () => setZoom(zoom / 1.5)), zbtn(icon('fit'), 'Adatta', () => setZoom(1)));

      for (const d of (p.dirs || [])) {
        const a = d.ang * Math.PI / 180, L = 44 * u, ex = cx + Math.sin(a) * L, ey = cy - Math.cos(a) * L, ha = 11 * u;
        const col = p.active ? 'var(--signal)' : '#1f4f8f';
        g1.append(sv('line', { x1: cx, y1: cy, x2: ex, y2: ey, stroke: '#ffffff', 'stroke-width': 7 * u, 'stroke-linecap': 'round' }));
        g1.append(sv('line', { x1: cx, y1: cy, x2: ex, y2: ey, stroke: col, 'stroke-width': 4 * u, 'stroke-linecap': 'round' }));
        g1.append(sv('polygon', { points: [[ex + Math.sin(a) * ha * .6, ey - Math.cos(a) * ha * .6], [ex + Math.sin(a + 2.5) * ha, ey - Math.cos(a + 2.5) * ha], [ex + Math.sin(a - 2.5) * ha, ey - Math.cos(a - 2.5) * ha]].map(q => q.join(',')).join(' '), fill: col, stroke: '#ffffff', 'stroke-width': 1.5 * u }));

          g1.append(sv('rect', { x: tx - tw / 2, y: ty - 8 * u, width: tw, height: 16 * u, rx: 3 * u, fill: '#ffffff' }));
          g1.append(sv('text', { x: tx, y: ty + 4.2 * u, 'text-anchor': 'middle', 'font-size': 12 * u, 'font-weight': 700, fill: '#1f4f8f', 'font-family': 'IBM Plex Mono, monospace' }, d.label));
        }

      const grp = sv('g', { class: onPointTap ? 'hit' : null });
      grp.append(sv('rect', { x: cx - tw / 2, y: cy - th / 2, width: tw, height: th, rx: th / 2, fill: p.active ? '#f2b705' : '#f2b705', stroke: '#1f1a08', 'stroke-width': (p.active ? 3 : 2) * u }));
      if (lbl) grp.append(sv('text', { x: cx, y: cy + 4.6 * u, 'text-anchor': 'middle', 'font-size': 13.5 * u, 'font-weight': 700, fill: '#1f1a08', 'font-family': 'IBM Plex Mono, monospace' }, lbl));
      else grp.append(sv('circle', { cx, cy, r: 4 * u, fill: '#1f1a08' }));
      if (onPointTap) grp.addEventListener('click', e => { e.stopPropagation(); onPointTap(p); });

  if (interactive) {
    img.addEventListener('click', e => { const r = img.getBoundingClientRect(); onTap?.(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)), natW, natH); });

  // zoom con due dita

  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

  return { el: root, setPoints(p) { pts = p; draw(); }, destroy() { ro.disconnect(); } };
}

      items.push({ type: 'c', cant, own: [cant.data.nome, cant.data.indirizzo, cant.data.committente], ctx: [] });

        h('div', { class: 'row-meta' }, fmtDay(it.grp.data.data)), icon('chev', 'chev'));
    }
    if (it.type === 'p') return h('button', { class: 'row', type: 'button', onclick: go },
      h('div', { class: 'res-ico' }, icon('map')),
      h('div', { class: 'row-main' }, h('div', { class: 'row-title' }, highlight(it.pianta.data.label || 'Planimetria', terms)), h('div', { class: 'row-sub' }, it.cant.data.nome)), icon('chev', 'chev'));
    const th = h('img', { class: 'row-thumb', alt: '', loading: 'lazy' }); Store.thumbURL(it.foto).then(u => th.src = u).catch(() => {});
    const f = it.foto.data;
    return h('button', { class: 'row', type: 'button', onclick: go }, th,
      h('div', { class: 'row-main' },
        h('div', { class: 'row-title' }, `Foto n. ${it.foto.n}`, h('span', { class: 'res-sub' }, ` · ${it.grp.data.titolo}`)),
        f.nota ? h('div', { class: 'row-sub res-note' }, highlight(f.nota, terms)) : null,
        h('div', { class: 'row-sub' }, `${it.cant.data.nome} · ${fmtDateTime(f.taken)}`)),
      icon('chev', 'chev'));
  }
  function run() {
    const q = input.value.trim(); const terms = norm(q).split(/\s+/).filter(Boolean);
    try { sessionStorage.setItem('fc_q', input.value); } catch {}
    if (!terms.length) { results.replaceChildren(h('div', { class: 'card empty' }, h('strong', null, 'Cosa cerchi?'), 'Scrivi una o più parole: nome o indirizzo del cantiere, committente, titolo o descrizione di un gruppo, nota di una foto, nome di una planimetria o una data (es. 18/10/2026).')); return; }
    const res = SearchIndex.query(q, type);
    if (!res.length) { results.replaceChildren(h('div', { class: 'card empty' }, h('strong', null, 'Nessun risultato'), `Nessun elemento contiene «${q}». Prova con meno parole o senza abbreviazioni.`)); return; }
    const labels = { c: 'Cantieri', g: 'Gruppi di foto', p: 'Planimetrie', f: 'Foto' };
    const groups = {}; for (const it of res) (groups[it.type] ||= []).push(it);
    const out = [];
    for (const k of ['c', 'g', 'p', 'f']) {
      if (!groups[k]) continue;
      const list = groups[k]; const shown = list.slice(0, 60);
      out.push(h('div', { class: 'section-label' }, `${labels[k]} · ${list.length}`));
      out.push(h('div', { class: 'card list' }, shown.map(it => row(it, terms)), list.length > shown.length ? h('div', { class: 'queue-item' }, `Altri ${list.length - shown.length} risultati: aggiungi una parola per restringere.`) : null));
    }
    results.replaceChildren(...out);
  }
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 160); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); run(); } });
  async function load() {
    paintChips();
    try { input.value = sessionStorage.getItem('fc_q') || ''; } catch {}
    // 1) risultati immediati dai dati salvati sul telefono
    await SearchIndex.build(false); // include subito anche ciò che è stato appena creato sul telefono
    paintStatus(); run();
    setTimeout(() => input.focus(), 50);
    // 2) aggiornamento dall'archivio (se più vecchio di 2 minuti)
    if (Date.now() - SearchIndex.netAt > 120000) {
      paintStatus('Aggiornamento in corso…');
      try { await SearchIndex.build(true, (d, n) => paintStatus(`Aggiornamento ${d} di ${n} cantieri…`)); } catch (e) { toast(e.message, 'err'); }
      paintStatus(); run();
    }
  }
  let loaded = false;
  return { el, onShow: () => { if (!loaded) { loaded = true; load(); } else run(); } };
}
async function openResult(it) {
  if (it.type === 'c') return Nav.push(() => CantiereView(it.cant));
  if (it.type === 'p') return Nav.push(() => CantiereView(it.cant, 'piante'));
  if (it.type === 'g') return Nav.pushMany([() => CantiereView(it.cant), () => GruppoView(it.cant, it.grp)]);
  const idx = it.fotos.indexOf(it.foto);
  Nav.pushMany([() => CantiereView(it.cant), () => GruppoView(it.cant, it.grp), () => FotoView(it.cant, it.grp, it.fotos, Math.max(0, idx))]);
}

function drawDemoPlan() {
  const W = 2000, H = 1300, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#222'; x.lineCap = 'square';
  const wall = (pts, w) => { x.lineWidth = w; x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.stroke(); };
  wall([[150, 150], [1850, 150], [1850, 1150], [150, 1150], [150, 150]], 22);
  wall([[950, 150], [950, 520]], 12); wall([[950, 660], [950, 1150]], 12);
  wall([[950, 600], [1400, 600]], 12); wall([[1520, 600], [1850, 600]], 12);
  wall([[1350, 150], [1350, 380]], 10); wall([[1350, 470], [1350, 600]], 10);
  wall([[150, 760], [480, 760]], 12); wall([[600, 760], [950, 760]], 12);
  x.lineWidth = 3; x.strokeStyle = '#555';
  const door = (cx, cy, r, a0, a1) => { x.beginPath(); x.arc(cx, cy, r, a0, a1); x.stroke(); };
  door(950, 520, 140, Math.PI / 2, Math.PI); door(1400, 600, 120, Math.PI, 1.5 * Math.PI); door(480, 760, 120, -Math.PI / 2, 0); door(1350, 380, 90, 0, Math.PI / 2);
  x.fillStyle = '#9fc3e6'; [[400, 150, 260], [1550, 150, 200], [1850, 800, 220], [600, 1150, 260]].forEach(([a, b, l]) => { if (b === 150 || b === 1150) x.fillRect(a, b - 8, l, 16); else x.fillRect(a - 8, b, 16, l); });
  x.fillStyle = '#333'; x.font = '600 46px Helvetica, Arial, sans-serif'; x.textAlign = 'center';
  [['Soggiorno', 550, 450], ['Camera', 550, 980], ['Cucina', 1150, 380], ['Bagno', 1600, 380], ['Camera', 1400, 900]].forEach(([t, a, b]) => x.fillText(t, a, b));
  x.font = '30px Helvetica, Arial, sans-serif'; x.fillStyle = '#666';
  [['31,5 m²', 550, 500], ['16,8 m²', 550, 1030], ['14,2 m²', 1150, 430], ['6,1 m²', 1600, 430], ['18,0 m²', 1400, 950]].forEach(([t, a, b]) => x.fillText(t, a, b));
  x.textAlign = 'left'; x.font = '600 34px Helvetica, Arial, sans-serif'; x.fillStyle = '#b00'; x.fillText('ESEMPIO — PIANTA PIANO TERRA (non in scala)', 150, 100);
  x.strokeStyle = '#222'; x.lineWidth = 4; x.beginPath(); x.moveTo(1780, 1270); x.lineTo(1780, 1190); x.stroke();
  x.beginPath(); x.moveTo(1765, 1210); x.lineTo(1780, 1185); x.lineTo(1795, 1210); x.fill(); x.font = '600 28px Helvetica, Arial'; x.fillStyle = '#222'; x.fillText('N', 1805, 1215);
  return canvasToBlob(c, 'image/jpeg', 0.9);
}
function drawDemoPhoto(n, title, hue) {
  const W = 1600, H = 1200, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, `hsl(${hue},12%,78%)`); g.addColorStop(0.62, `hsl(${hue},10%,68%)`); g.addColorStop(0.63, `hsl(${hue + 20},14%,48%)`); g.addColorStop(1, `hsl(${hue + 20},12%,36%)`);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(0,0,0,.18)'; x.lineWidth = 3;
  for (let i = 0; i < 9; i++) { x.beginPath(); x.moveTo(200 + i * 140, 760); x.lineTo(-400 + i * 300, H); x.stroke(); }
  x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(980, 180, 360, 420); x.strokeStyle = 'rgba(0,0,0,.35)'; x.lineWidth = 10; x.strokeRect(980, 180, 360, 420);
  x.strokeStyle = '#c2410c'; x.lineWidth = 14; x.beginPath(); x.moveTo(260, 740); x.lineTo(260, 330); x.lineTo(720, 330); x.stroke();
  x.fillStyle = 'rgba(15,20,25,.72)'; x.fillRect(0, 0, W, 170);
  x.fillStyle = '#fff'; x.font = '700 64px Helvetica, Arial, sans-serif'; x.fillText(`FOTO DI ESEMPIO ${n}`, 60, 100);
  x.font = '36px Helvetica, Arial, sans-serif'; x.fillStyle = '#f2b705'; x.fillText(title, 60, 150);

}
async function seedDemo() {
  if (await IDB.get('kv', 'demoSeeded')) return;
  const c = await Local.create('cantiere', ROOT_ID, { nome: 'Esempio – Ristrutturazione appartamento', indirizzo: 'Indirizzo di prova', committente: 'Committente di prova', intestazione: CONFIG.INTESTAZIONE_DEFAULT, contatti: CONFIG.CONTATTI_DEFAULT });
  const pb = await drawDemoPlan();
  const p = await Local.create('pianta', c.id, { label: 'Piano terra (esempio)' }, pb);
  const g = await Local.create('gruppo', c.id, { titolo: 'Sopralluogo impianti (esempio)', data: todayISO(), descrizione: 'Gruppo di prova creato per mostrare come funziona l\'app: punti sulla planimetria, direzione di ripresa, note e rapporto PDF. Puoi eliminarlo.' });
  const base = Date.now() - 3600 * 1000;
  const shots = [
    [0.33, 0.42, 90, 'Esempio: parete soggiorno, tracce impianto elettrico', 210],
    [0.33, 0.42, 180, 'Esempio: stesso punto, vista verso la camera', 210],
    [0.57, 0.27, 0, 'Esempio: cucina, attacchi idraulici da spostare', 30],
    [0.79, 0.28, 270, 'Esempio: bagno, scarico esistente', 190],
    [0.70, 0.70, 0, 'Esempio: camera, finestra lato est', 120],
  ];
  for (let i = 0; i < shots.length; i++) {
    const [px, py, ang, nota, hue] = shots[i];
    await Local.create('foto', g.id, { taken: new Date(base + i * 240000).toISOString(), pianta: p.id, x: px, y: py, ang, nota, autore: CONFIG.INTESTAZIONE_DEFAULT }, await drawDemoPhoto(i + 1, nota.replace('Esempio: ', ''), hue));
  }
  await IDB.put('kv', 'demoSeeded', true);
}
async function resetDemo() {
  for (const s of ['ents', 'queue', 'kv', 'blobs']) await IDB.clear(s);
  Store.idmap = {}; Store.urls.clear(); await Store.refreshStatus(); await seedDemo();
}

async function boot() {
  let raf = false;
  Store.on(() => { paintChips(); if (raf) return; raf = true; setTimeout(() => { raf = false; paintChips(); Nav.top()?.onStore?.(); }, 60); });
  if (MODE === 'demo') {
    await seedDemo(); await Store.init(); Nav.reset(() => HomeView()); return;
  }
  Auth.load();
  const red = Auth.readRedirect();
  if (red?.error) return Nav.reset(() => LoginView(red.error));
  // All'apertura: se l'accesso è scaduto lo rinnova subito, senza chiedere nulla.
  if (!red && Auth.user && !Auth.valid() && Auth.canSilent() && navigator.onLine) { $('#app').replaceChildren(h('div', { class: 'spin' })); return Auth.start({ silent: true }); }
  if (red?.ok) {
    $('#app').replaceChildren(h('div', { class: 'spin' }));
    try {
      const user = await Drive.whoami();
      if (CONFIG.ALLOWED_EMAILS.length && !CONFIG.ALLOWED_EMAILS.map(e => e.toLowerCase()).includes(user.email)) { Auth.signOut(); return Nav.reset(() => LoginView(`L'account ${user.email} non è tra quelli autorizzati.`)); }
      const root = await Drive.rootInfo();
      if (!root) { Auth.signOut(); return Nav.reset(() => LoginView(`L'account ${user.email} non ha accesso all'archivio. Chiedi all'amministratore di condividere con te la cartella Google Drive.`)); }
      if (Auth.user && Auth.user.email !== user.email) { await Store.clearCache(); for (const k of await IDB.keys('kv')) if (String(k).startsWith('list:')) await IDB.del('kv', k); }
      Auth.user = { ...user, readonly: !root.capabilities?.canAddChildren }; Auth.save();
    } catch (e) {
      if (!(red.silent && Auth.user && e.offline)) return Nav.reset(() => LoginView('Verifica dell\'accesso non riuscita: ' + e.message));
    }
  }
  if (!Auth.user) return Nav.reset(() => LoginView());
  READONLY = !!Auth.user.readonly;
  await Store.init();
  if (red?.silentFailed) Store.status.net = 'auth';
  if (red) await restoreRoute(); else Nav.reset(() => HomeView());
  if (red?.silentFailed) setTimeout(() => toast('Accesso da riattivare: tocca il pallino arancione in alto'), 600);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(() => Auth.maybeRenew('resume'), 500); });
}

// Dopo il rinnovo dell'accesso riporta alla schermata in cui si era (cantiere o gruppo).
async function restoreRoute() {
  let r = null; try { r = JSON.parse(localStorage.getItem('fc_route') || 'null'); localStorage.removeItem('fc_route'); } catch {}
  const views = [() => HomeView()];
  try {
    if (r?.c) {
      const cant = ((await Store.cachedList('cantiere', ROOT_ID)) || []).find(x => Store.same(x.id, r.c));
      if (cant) {
        views.push(() => CantiereView(cant));
        if (r.g) {
          const grp = ((await Store.cachedList('gruppo', cant.id)) || []).find(x => Store.same(x.id, r.g));
          if (grp) views.push(() => GruppoView(cant, grp));
        }
      }
    }
  } catch (e) { console.error(e); }
  while (Nav.stack.length) Nav.stack.pop().destroy?.();
  Nav.pushMany(views);
}

window.addEventListener('error', e => console.error(e.error || e.message));
window.addEventListener('unhandledrejection', e => { console.error(e.reason); });

boot().catch(e => { console.error(e); $('#app').replaceChildren(h('div', { class: 'main gut' }, h('div', { class: 'notice err' }, h('strong', null, 'Avvio non riuscito. '), e.message))); });
